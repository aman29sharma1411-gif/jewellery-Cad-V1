<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jewellery CAD AI V2.1</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  height:60px;
  background:#1d1d1d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:bold;
}

#panel{
  padding:12px;
  background:#181818;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}

select,
button{
  padding:10px;
  border-radius:8px;
  border:1px solid #555;
  background:#292929;
  color:white;
  font-size:14px;
}

button{
  cursor:pointer;
}

#viewer{
  width:100%;
  height:calc(100vh - 130px);
  min-height:450px;
  position:relative;
  overflow:hidden;
}

#status{
  position:absolute;
  top:10px;
  left:10px;
  z-index:10;
  background:rgba(0,0,0,.7);
  padding:8px 12px;
  border-radius:8px;
  font-size:13px;
}

#error{
  display:none;
  position:absolute;
  left:10px;
  right:10px;
  bottom:10px;
  z-index:20;
  background:#500;
  color:white;
  padding:12px;
  border-radius:8px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
💎 Jewellery CAD AI V2.1
</header>

<div id="panel">

<select id="type">
  <option value="bangle">Bangle</option>
  <option value="ring">Ring</option>
  <option value="bracelet">Bracelet</option>
  <option value="necklace">Necklace</option>
  <option value="earring">Earring</option>
</select>

<select id="metal">
  <option value="yellow">Yellow Gold</option>
  <option value="white">White Gold</option>
  <option value="rose">Rose Gold</option>
</select>

<select id="stone">
  <option value="diamond">Diamond</option>
  <option value="none">No Stone</option>
</select>

<button onclick="generate()">Generate CAD</button>

<button onclick="resetView()">Reset View</button>

<button onclick="toggleStones()">Show / Hide Stones</button>

</div>

<div id="viewer">

<div id="status">
V2.1 Loading 3D...
</div>

<div id="error"></div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


let scene;
let camera;
let renderer;
let object;
let stonesGroup;

let stonesVisible = true;


function init(){

  scene = new THREE.Scene();

  scene.background = new THREE.Color(0x111111);


  camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth /
    document.getElementById("viewer").clientHeight,
    0.1,
    1000
  );

  camera.position.set(0,2.5,7);


  renderer = new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
  );

  renderer.setSize(
    window.innerWidth,
    document.getElementById("viewer").clientHeight
  );

  document
    .getElementById("viewer")
    .appendChild(renderer.domElement);


  /* LIGHT */

  const ambient =
    new THREE.AmbientLight(
      0xffffff,
      2
    );

  scene.add(ambient);


  const light =
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  light.position.set(5,5,5);

  scene.add(light);


  const light2 =
    new THREE.DirectionalLight(
      0xffffff,
      2
    );

  light2.position.set(-5,2,-5);

  scene.add(light2);


  /* TEST MODEL */

  generate();


  document.getElementById("status").innerText =
    "✅ V2.1 3D ACTIVE";


  animate();
}


function goldMaterial(){

  let metal =
    document.getElementById("metal").value;

  let color = 0xd4af37;

  if(metal === "white"){
    color = 0xd9e0e6;
  }

  if(metal === "rose"){
    color = 0xb76e79;
  }

  return new THREE.MeshStandardMaterial({

    color:color,

    metalness:0.85,

    roughness:0.2

  });
}


function generate(){

  if(!scene) return;


  if(object){

    scene.remove(object);

  }


  stonesGroup =
    new THREE.Group();


  const type =
    document.getElementById("type").value;


  if(type === "bangle"){

    object =
      createBangle();

  }

  else if(type === "ring"){

    object =
      createRing();

  }

  else if(type === "bracelet"){

    object =
      createBracelet();

  }

  else if(type === "necklace"){

    object =
      createNecklace();

  }

  else if(type === "earring"){

    object =
      createEarring();

  }


  scene.add(object);

  resetView();

}


function createBangle(){

  const group =
    new THREE.Group();


  const material =
    goldMaterial();


  const torus =
    new THREE.Mesh(

      new THREE.TorusGeometry(
        2,
        0.32,
        32,
        100
      ),

      material

    );


  group.add(torus);


  addDiamonds(
    group,
    2,
    0.34,
    24
  );


  return group;

}


function createRing(){

  const group =
    new THREE.Group();


  const material =
    goldMaterial();


  const ring =
    new THREE.Mesh(

      new THREE.TorusGeometry(
        1.5,
        0.25,
        32,
        100
      ),

      material

    );


  group.add(ring);


  const top =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        0.55,
        32,
        32
      ),

      material

    );


  top.position.y = 1.35;

  group.add(top);


  return group;

}


function createBracelet(){

  const group =
    new THREE.Group();


  const material =
    goldMaterial();


  for(let i=0;i<5;i++){

    const part =
      new THREE.Mesh(

        new THREE.TorusGeometry(
          1.65,
          0.22,
          24,
          80
        ),

        material

      );


    part.rotation.x =
      i * 0.25;


    group.add(part);

  }


  addDiamonds(
    group,
    1.65,
    0.25,
    20
  );


  return group;

}


function createNecklace(){

  const group =
    new THREE.Group();


  const material =
    goldMaterial();


  const curve =
    new THREE.EllipseCurve(
      0,
      0,
      2.6,
      2.0,
      Math.PI,
      Math.PI*2,
      false,
      0
    );


  const points =
    curve.getPoints(80);


  const geometry =
    new THREE.BufferGeometry()
      .setFromPoints(
        points.map(
          p =>
            new THREE.Vector3(
              p.x,
              -p.y,
              0
            )
        )
      );


  const line =
    new THREE.Line(

      geometry,

      new THREE.LineBasicMaterial({
        color:0xd4af37
      })

    );


  group.add(line);


  return group;

}


function createEarring(){

  const group =
    new THREE.Group();


  const material =
    goldMaterial();


  const hoop =
    new THREE.Mesh(

      new THREE.TorusGeometry(
        1.3,
        0.18,
        24,
        80
      ),

      material

    );


  group.add(hoop);


  const diamond =
    new THREE.Mesh(

      new THREE.OctahedronGeometry(
        0.45,
        1
      ),

      new THREE.MeshStandardMaterial({

        color:0xffffff,

        metalness:0.1,

        roughness:0.05

      })

    );


  diamond.position.y =
    1.35;


  group.add(diamond);


  return group;

}


function addDiamonds(
  group,
  radius,
  size,
  count
){

  const stone =
    document.getElementById("stone").value;


  if(stone === "none"){

    return;

  }


  for(
    let i=0;
    i<count;
    i++
  ){

    const angle =
      (i/count) *
      Math.PI*2;


    const diamond =
      new THREE.Mesh(

        new THREE.OctahedronGeometry(
          size,
          1
        ),

        new THREE.MeshStandardMaterial({

          color:0xffffff,

          metalness:0.1,

          roughness:0.05

        })

      );


    diamond.position.set(

      Math.cos(angle)*radius,

      0,

      Math.sin(angle)*radius

    );


    group.add(diamond);

  }

}


function resetView(){

  if(!object) return;

  object.rotation.set(
    0,
    0,
    0
  );

}


function toggleStones(){

  stonesVisible =
    !stonesVisible;


  if(!object) return;


  object.traverse(
    child => {

      if(
        child.isMesh &&
        child.material &&
        child.material.color
      ){

        const c =
          child.material.color;


        if(
          c.r > 0.8 &&
          c.g > 0.8 &&
          c.b > 0.8
        ){

          child.visible =
            stonesVisible;

        }

      }

    }
  );

}


function animate(){

  requestAnimationFrame(
    animate
  );


  if(object){

    object.rotation.y +=
      0.005;

  }


  renderer.render(
    scene,
    camera
  );

}


window.addEventListener(
  "resize",
  () => {

    if(!renderer) return;

    const height =
      document.getElementById("viewer")
      .clientHeight;


    camera.aspect =
      window.innerWidth /
      height;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      height
    );

  }
);


try{

  init();

}

catch(error){

  console.error(error);

  const box =
    document.getElementById("error");

  box.style.display =
    "block";

  box.innerText =
    "❌ 3D Error: " +
    error.message;

  document.getElementById("status")
    .innerText =
    "3D failed";

}

</script>

</body>
</html>
