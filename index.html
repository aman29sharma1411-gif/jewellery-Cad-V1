<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jewellery CAD AI V1.3</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111318;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#191c24;
  border-bottom:1px solid #333;
}

header h2{
  margin:0;
  font-size:20px;
}

header span{
  color:#aaa;
  font-size:13px;
}

#viewer{
  width:100vw;
  height:calc(100vh - 60px);
}

.panel{
  position:fixed;
  left:10px;
  top:70px;
  width:250px;
  max-height:calc(100vh - 80px);
  overflow-y:auto;
  padding:14px;
  background:rgba(25,28,36,.97);
  border:1px solid #444;
  border-radius:14px;
  z-index:20;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}

.panel h3{
  margin:0 0 12px;
}

label{
  display:block;
  font-size:13px;
  margin-top:11px;
  color:#bbb;
}

select{
  width:100%;
  margin-top:6px;
  padding:9px;
  border-radius:8px;
  border:1px solid #555;
  background:#20242e;
  color:white;
}

input[type=file]{
  width:100%;
  margin-top:6px;
  padding:8px;
  border-radius:8px;
  border:1px solid #555;
  background:#20242e;
  color:white;
  font-size:11px;
}

input[type=range]{
  width:100%;
}

button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:9px;
  background:#444b5a;
  color:white;
  font-weight:bold;
}

.generate{
  background:#9a741c;
}

.value{
  float:right;
}

#photoPreview{
  width:100%;
  height:150px;
  object-fit:contain;
  background:#08090c;
  margin-top:8px;
  border-radius:9px;
  border:1px solid #555;
  display:none;
}

.photoBox{
  margin-top:8px;
  padding:6px;
  border:1px dashed #555;
  border-radius:9px;
  text-align:center;
  color:#888;
  font-size:11px;
}

.status{
  margin-top:10px;
  padding:9px;
  border-radius:8px;
  background:#20242e;
  color:#aaa;
  font-size:12px;
  line-height:1.4;
}

#referenceViewer{
  position:fixed;
  right:15px;
  top:75px;
  width:220px;
  max-height:250px;
  padding:8px;
  background:rgba(15,16,20,.9);
  border:1px solid #444;
  border-radius:12px;
  z-index:15;
  display:none;
}

#referenceViewer img{
  width:100%;
  max-height:210px;
  object-fit:contain;
  display:block;
}

.referenceTitle{
  font-size:11px;
  color:#aaa;
  margin-bottom:6px;
}

@media(max-width:600px){

  .panel{
    width:215px;
    left:6px;
    top:67px;
    padding:10px;
  }

  header h2{
    font-size:16px;
  }

  header span{
    display:none;
  }

  #referenceViewer{
    width:145px;
    right:7px;
    top:67px;
  }

  #referenceViewer img{
    max-height:130px;
  }
}
</style>
</head>

<body>

<header>
  <h2>💎 Jewellery CAD AI V1.3</h2>
  <span>3D Jewellery Designer</span>
</header>

<div class="panel">

<h3>✨ CAD Controls</h3>

<label>📷 Reference Photo</label>

<input
  id="photo"
  type="file"
  accept="image/*"
>

<div class="photoBox">
  Select your jewellery photo
</div>

<img id="photoPreview">

<label>Jewellery Type</label>

<select id="jewelleryType">
  <option value="bangle">Bangle</option>
  <option value="ring">Ring</option>
  <option value="bracelet">Bracelet</option>
  <option value="necklace">Necklace</option>
  <option value="earring">Earring</option>
</select>

<label>Metal</label>

<select id="metal">
  <option value="yellow">Yellow Gold</option>
  <option value="white">White Gold</option>
  <option value="rose">Rose Gold</option>
</select>

<label>Stone</label>

<select id="stoneType">
  <option value="diamond">Diamond</option>
  <option value="solitaire">Solitaire</option>
  <option value="none">None</option>
</select>

<label>
  Size
  <span class="value" id="sizeValue">3.0</span>
</label>

<input
  id="size"
  type="range"
  min="2"
  max="5"
  step="0.1"
  value="3"
>

<label>
  Thickness
  <span class="value" id="thickValue">0.22</span>
</label>

<input
  id="thickness"
  type="range"
  min="0.10"
  max="0.50"
  step="0.01"
  value="0.22"
>

<label>
  Stones
  <span class="value" id="stoneValue">24</span>
</label>

<input
  id="stones"
  type="range"
  min="4"
  max="60"
  value="24"
>

<button
  class="generate"
  id="generateBtn"
>
✨ Generate CAD Concept
</button>

<button id="resetBtn">
🔄 Reset View
</button>

<button id="stonesBtn">
👁️ Show / Hide Stones
</button>

<button id="photoBtn">
🖼️ Show / Hide Reference
</button>

<div class="status" id="status">
Ready — Upload a reference photo or select jewellery type.
</div>

</div>

<div id="referenceViewer">
  <div class="referenceTitle">
    📷 Reference Image
  </div>
  <img id="viewerPhoto">
</div>

<div id="viewer"></div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


let scene;
let camera;
let renderer;
let controls;

let jewelleryGroup;
let stones=[];

let showStones=true;
let referenceVisible=false;


const params={
  size:3,
  thickness:0.22,
  stones:24
};


init();
generateCAD();


function init(){

  scene=new THREE.Scene();

  scene.background=
    new THREE.Color(0x111318);


  camera=
    new THREE.PerspectiveCamera(
      45,
      window.innerWidth/
      (window.innerHeight-60),
      0.1,
      100
    );


  camera.position.set(
    0,
    3.5,
    8
  );


  renderer=
    new THREE.WebGLRenderer({
      antialias:true
    });


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );


  renderer.setSize(
    window.innerWidth,
    window.innerHeight-60
  );


  document
    .getElementById("viewer")
    .appendChild(
      renderer.domElement
    );


  /* LIGHTING */

  scene.add(
    new THREE.AmbientLight(
      0xffffff,
      1.2
    )
  );


  const light1=
    new THREE.DirectionalLight(
      0xffffff,
      2.5
    );

  light1.position.set(
    5,7,6
  );

  scene.add(light1);


  const light2=
    new THREE.DirectionalLight(
      0xffffff,
      1.5
    );

  light2.position.set(
    -5,3,-5
  );

  scene.add(light2);


  const light3=
    new THREE.PointLight(
      0xffffff,
      1.5
    );

  light3.position.set(
    0,5,3
  );

  scene.add(light3);


  controls=
    new OrbitControls(
      camera,
      renderer.domElement
    );


  controls.enableDamping=true;

  controls.dampingFactor=0.08;

  controls.minDistance=2;

  controls.maxDistance=20;


  window.addEventListener(
    "resize",
    resize
  );


  animate();

}


function getMetalColor(){

  const value=
    document.getElementById(
      "metal"
    ).value;


  if(value==="white")
    return 0xd9dde2;

  if(value==="rose")
    return 0xb76e79;

  return 0xd4af37;

}


function metalMaterial(){

  return new THREE.MeshStandardMaterial({

    color:getMetalColor(),

    metalness:.9,

    roughness:.18

  });

}


function stoneMaterial(){

  return new THREE.MeshPhysicalMaterial({

    color:0xffffff,

    metalness:0,

    roughness:.04,

    transmission:.25,

    transparent:true,

    opacity:.96

  });

}


function clearModel(){

  if(jewelleryGroup){

    scene.remove(
      jewelleryGroup
    );

  }


  stones=[];


  jewelleryGroup=
    new THREE.Group();


  scene.add(
    jewelleryGroup
  );

}


function generateCAD(){

  params.size=
    parseFloat(
      document.getElementById(
        "size"
      ).value
    );


  params.thickness=
    parseFloat(
      document.getElementById(
        "thickness"
      ).value
    );


  params.stones=
    parseInt(
      document.getElementById(
        "stones"
      ).value
    );


  updateLabels();

  clearModel();


  const type=
    document.getElementById(
      "jewelleryType"
    ).value;


  if(type==="bangle")
    createBangle();

  if(type==="ring")
    createRing();

  if(type==="bracelet")
    createBracelet();

  if(type==="necklace")
    createNecklace();

  if(type==="earring")
    createEarring();


  resetView();


  document.getElementById(
    "status"
  ).innerHTML=
    "✅ 3D "+type+
    " generated successfully.";

}


/* BANGLE */

function createBangle(){

  const radius=params.size;

  const tube=params.thickness;


  const ring=
    new THREE.Mesh(

      new THREE.TorusGeometry(
        radius,
        tube,
        32,
        128
      ),

      metalMaterial()

    );


  ring.rotation.x=
    Math.PI/2;


  jewelleryGroup.add(
    ring
  );


  addCircularStones(
    radius,
    params.stones,
    tube
  );

}


/* RING */

function createRing(){

  const radius=
    params.size*.72;

  const tube=
    params.thickness;


  const ring=
    new THREE.Mesh(

      new THREE.TorusGeometry(
        radius,
        tube,
        32,
        128
      ),

      metalMaterial()

    );


  ring.rotation.x=
    Math.PI/2;


  jewelleryGroup.add(
    ring
  );


  const stoneType=
    document.getElementById(
      "stoneType"
    ).value;


  if(stoneType!=="none"){

    const stone=
      new THREE.Mesh(

        new THREE.OctahedronGeometry(
          tube*2.3,
          2
        ),

        stoneMaterial()

      );


    stone.position.set(
      0,
      radius*1.02,
      0
    );


    jewelleryGroup.add(
      stone
    );


    stones.push(stone);

  }

}


/* BRACELET */

function createBracelet(){

  const links=12;

  const radius=
    params.size*.75;


  for(
    let i=0;
    i<links;
    i++
  ){

    const angle=
      i/links*Math.PI*2;


    const link=
      new THREE.Mesh(

        new THREE.TorusGeometry(
          .55,
          params.thickness,
          20,
          40
        ),

        metalMaterial()

      );


    link.position.set(

      Math.cos(angle)*radius,

      0,

      Math.sin(angle)*radius

    );


    link.rotation.x=
      Math.PI/2;


    link.rotation.y=
      angle;


    jewelleryGroup.add(
      link
    );

  }


  addCircularStones(
    radius,
    params.stones,
    params.thickness
  );

}


/* NECKLACE */

function createNecklace(){

  const curve=
    new THREE.EllipseCurve(
      0,
      0,
      params.size*1.5,
      params.size*.9,
      Math.PI*.05,
      Math.PI*.95,
      false,
      0
    );


  const points=
    curve.getPoints(100);


  const path=
    new THREE.CatmullRomCurve3(

      points.map(
        p=>
        new THREE.Vector3(
          p.x,
          0,
          p.y
        )
      )

    );


  const necklace=
    new THREE.Mesh(

      new THREE.TubeGeometry(
        path,
        100,
        params.thickness*.55,
        12,
        false
      ),

      metalMaterial()

    );


  jewelleryGroup.add(
    necklace
  );


  addNecklaceStones(
    points
  );

}


/* EARRING */

function createEarring(){

  const group=
    new THREE.Group();


  const hoop=
    new THREE.Mesh(

      new THREE.TorusGeometry(
        params.size*.7,
        params.thickness,
        24,
        64
      ),

      metalMaterial()

    );


  hoop.rotation.x=
    Math.PI/2;


  group.add(hoop);


  const stoneType=
    document.getElementById(
      "stoneType"
    ).value;


  if(stoneType!=="none"){

    const stone=
      new THREE.Mesh(

        new THREE.OctahedronGeometry(
          params.thickness*2,
          2
        ),

        stoneMaterial()

      );


    stone.position.set(
      0,
      params.size*.7,
      0
    );


    group.add(stone);

    stones.push(stone);

  }


  jewelleryGroup.add(
    group
  );

}


/* STONES */

function addCircularStones(
  radius,
  count,
  size
){

  const type=
    document.getElementById(
      "stoneType"
    ).value;


  if(type==="none")
    return;


  const geometry=
    new THREE.OctahedronGeometry(
      size*.8,
      1
    );


  const material=
    stoneMaterial();


  for(
    let i=0;
    i<count;
    i++
  ){

    const angle=
      i/count*Math.PI*2;


    const stone=
      new THREE.Mesh(
        geometry,
        material
      );


    stone.position.set(

      Math.cos(angle)*radius,

      size*1.15,

      Math.sin(angle)*radius

    );


    jewelleryGroup.add(
      stone
    );


    stones.push(
      stone
    );

  }

}


function addNecklaceStones(points){

  const type=
    document.getElementById(
      "stoneType"
    ).value;


  if(type==="none")
    return;


  const count=
    Math.min(
      params.stones,
      points.length
    );


  const geometry=
    new THREE.OctahedronGeometry(
      params.thickness*1.2,
      1
    );


  const material=
    stoneMaterial();


  for(
    let i=0;
    i<count;
    i++
  ){

    const index=
      Math.floor(
        i/
        Math.max(count-1,1)*
        (points.length-1)
      );


    const p=
      points[index];


    const stone=
      new THREE.Mesh(
        geometry,
        material
      );


    stone.position.set(
      p.x,
      .15,
      p.y
    );


    jewelleryGroup.add(
      stone
    );


    stones.push(
      stone
    );

  }

}


/* LABELS */

function updateLabels(){

  document.getElementById(
    "sizeValue"
  ).textContent=
    params.size.toFixed(1);


  document.getElementById(
    "thickValue"
  ).textContent=
    params.thickness.toFixed(2);


  document.getElementById(
    "stoneValue"
  ).textContent=
    params.stones;

}


/* PHOTO UPLOAD */

document.getElementById(
  "photo"
).addEventListener(
  "change",
  function(){

    const file=this.files[0];

    if(!file)
      return;


    const url=
      URL.createObjectURL(file);


    const preview=
      document.getElementById(
        "photoPreview"
      );


    const viewerPhoto=
      document.getElementById(
        "viewerPhoto"
      );


    preview.src=url;

    viewerPhoto.src=url;


    preview.style.display=
      "block";


    document.getElementById(
      "referenceViewer"
    ).style.display=
      "block";


    referenceVisible=true;


    document.getElementById(
      "status"
    ).innerHTML=
      "📷 Reference photo loaded successfully.";

  }
);


/* BUTTONS */

document.getElementById(
  "generateBtn"
).addEventListener(
  "click",
  generateCAD
);


document.getElementById(
  "resetBtn"
).addEventListener(
  "click",
  resetView
);


document.getElementById(
  "stonesBtn"
).addEventListener(
  "click",
  toggleStones
);


document.getElementById(
  "photoBtn"
).addEventListener(
  "click",
  toggleReference
);


/* AUTO UPDATE */

document.getElementById(
  "size"
).addEventListener(
  "input",
  updateLabels
);


document.getElementById(
  "thickness"
).addEventListener(
  "input",
  updateLabels
);


document.getElementById(
  "stones"
).addEventListener(
  "input",
  updateLabels
);


document.getElementById(
  "jewelleryType"
).addEventListener(
  "change",
  generateCAD
);


document.getElementById(
  "metal"
).addEventListener(
  "change",
  generateCAD
);


document.getElementById(
  "stoneType"
).addEventListener(
  "change",
  generateCAD
);


/* STONE TOGGLE */

function toggleStones(){

  showStones=!showStones;


  stones.forEach(
    stone=>{
      stone.visible=
        showStones;
    }
  );

}


/* REFERENCE TOGGLE */

function toggleReference(){

  referenceVisible=
    !referenceVisible;


  document.getElementById(
    "referenceViewer"
  ).style.display=
    referenceVisible
    ? "block"
    : "none";

}


/* RESET */

function resetView(){

  camera.position.set(
    0,
    3.5,
    8
  );


  controls.target.set(
    0,
    0,
    0
  );


  controls.update();

}


/* RESIZE */

function resize(){

  const height=
    window.innerHeight-60;


  camera.aspect=
    window.innerWidth/height;


  camera.updateProjectionMatrix();


  renderer.setSize(
    window.innerWidth,
    height
  );

}


/* ANIMATION */

function animate(){

  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}

</script>

</body>
  </html>
