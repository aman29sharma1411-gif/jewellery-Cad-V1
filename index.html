<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Jewellery CAD AI V2.6</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  height:60px;
  background:#151515;
  display:flex;
  align-items:center;
  padding:0 15px;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #333;
}

.container{
  width:100%;
  max-width:950px;
  margin:auto;
  padding:12px;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.box,
.reference{
  background:#171717;
  border-radius:11px;
  padding:11px;
}

label{
  display:block;
  color:#bbb;
  font-size:13px;
  margin-bottom:6px;
}

select,
input{
  width:100%;
  padding:11px;
  border-radius:8px;
  border:1px solid #444;
  background:#242424;
  color:#fff;
}

button{
  width:100%;
  border:0;
  border-radius:9px;
  padding:13px;
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  background:#d8b437;
  color:#111;
}

button.secondary{
  background:#333;
  color:#fff;
}

.viewButtons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.viewButtons button{
  font-size:13px;
  padding:10px;
}

.reference{
  margin-top:10px;
}

#preview{
  display:none;
  width:100%;
  max-height:180px;
  object-fit:contain;
  margin-top:8px;
  border-radius:8px;
}

.viewer{
  height:500px;
  margin-top:12px;
  background:#010101;
  border:1px solid #333;
  border-radius:13px;
  overflow:hidden;
  position:relative;
}

#viewer{
  width:100%;
  height:100%;
}

.status{
  position:absolute;
  z-index:5;
  top:10px;
  left:10px;
  padding:7px 10px;
  border-radius:7px;
  background:rgba(0,0,0,.75);
  font-size:12px;
}

.error{
  display:none;
  position:absolute;
  z-index:20;
  top:50px;
  left:10px;
  right:10px;
  padding:12px;
  border-radius:8px;
  background:#421414;
  color:#ffb4b4;
  font-size:13px;
}

.info{
  margin-top:10px;
  background:#121212;
  border:1px solid #292929;
  border-radius:10px;
  padding:10px;
  font-size:12px;
  color:#aaa;
  line-height:1.5;
}

@media(max-width:600px){

  .viewer{
    height:430px;
  }

  .viewButtons button{
    font-size:12px;
  }

}

</style>
</head>

<body>

<header>
💎 Jewellery CAD AI V2.6
</header>

<div class="container">

<div class="controls">

<!-- JEWELLERY TYPE -->

<div class="box">

<label>Jewellery Type</label>

<select id="type">

<option value="bangle">
Bangle
</option>

<option value="ring">
Ring
</option>

<option value="bracelet">
Bracelet
</option>

<option value="necklace">
Necklace
</option>

<option value="earring">
Earring
</option>

</select>

</div>


<!-- METAL -->

<div class="box">

<label>Metal</label>

<select id="metal">

<option value="yellow">
Yellow Gold
</option>

<option value="white">
White Gold
</option>

<option value="rose">
Rose Gold
</option>

</select>

</div>


<!-- STONE -->

<div class="box">

<label>Stone</label>

<select id="stone">

<option value="diamond">
Diamond
</option>

<option value="solitaire">
Solitaire
</option>

<option value="none">
None
</option>

</select>

</div>


<!-- STYLE -->

<div class="box">

<label>Design Style</label>

<select id="style">

<option value="classic">
Classic
</option>

<option value="pave">
Pavé
</option>

<option value="solitaire">
Solitaire
</option>

</select>

</div>


<!-- SIZE -->

<div class="box">

<label>Size</label>

<select id="size">

<option value="2.2">
2.2
</option>

<option value="2.4">
2.4
</option>

<option value="2.5" selected>
2.5
</option>

<option value="2.6">
2.6
</option>

<option value="2.8">
2.8
</option>

<option value="3.0">
3.0
</option>

</select>

</div>


<!-- THICKNESS -->

<div class="box">

<label>
Thickness
</label>

<input
id="thickness"
type="range"
min="0.16"
max="0.50"
step="0.01"
value="0.28"
oninput="thicknessValue.innerText=this.value">

<div style="text-align:center;margin-top:5px">

<span id="thicknessValue">
0.28
</span>

</div>

</div>


<!-- DIAMONDS -->

<div class="box">

<label>
Diamonds
</label>

<input
id="diamondCount"
type="range"
min="0"
max="60"
step="1"
value="24"
oninput="diamondValue.innerText=this.value">

<div style="text-align:center;margin-top:5px">

<span id="diamondValue">
24
</span>

</div>

</div>


<!-- DIAMOND SIZE -->

<div class="box">

<label>
Diamond Size
</label>

<select id="diamondSize">

<option value="small">
Small
</option>

<option value="medium" selected>
Medium
</option>

<option value="large">
Large
</option>

</select>

</div>

</div>


<!-- REFERENCE -->

<div class="reference">

<label>
Reference Photo
</label>

<input
type="file"
id="reference"
accept="image/*">

<img
id="preview">

</div>


<!-- GENERATE -->

<button onclick="generateCAD()">

✨ Generate CAD

</button>


<!-- RESET -->

<button
class="secondary"
onclick="resetCAD()">

↻ Reset

</button>


<!-- STONES -->

<button
class="secondary"
onclick="toggleStones()">

💎 Show / Hide Stones

</button>


<!-- VIEW BUTTONS -->

<div class="viewButtons">

<button
class="secondary"
onclick="frontView()">

Front

</button>

<button
class="secondary"
onclick="topView()">

Top

</button>

<button
class="secondary"
onclick="resetView()">

3D View

</button>

</div>


<!-- VIEWER -->

<div class="viewer">

<div
class="status"
id="status">

V2.6 Starting...

</div>

<div
class="error"
id="error">
</div>

<div id="viewer">
</div>

</div>


<div class="info">

👆 Drag = Rotate &nbsp; | &nbsp;
🤏 Pinch = Zoom &nbsp; | &nbsp;
Two fingers = Pan

</div>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


<script>

/* =====================================
   GLOBAL VARIABLES
===================================== */

let scene;
let camera;
let renderer;
let controls;

let jewelleryGroup;
let stoneGroup;

let stonesVisible=true;


/* =====================================
   INITIALIZE
===================================== */

function init(){

try{

scene=
new THREE.Scene();

scene.background=
new THREE.Color(0x020202);


/* CAMERA */

camera=
new THREE.PerspectiveCamera(
45,
1,
0.1,
1000
);

camera.position.set(
0,
4.8,
8
);


/* RENDERER */

renderer=
new THREE.WebGLRenderer({

antialias:true,

alpha:false

});

renderer.setPixelRatio(
Math.min(
window.devicePixelRatio,
2
)
);

let viewer=
document.getElementById(
"viewer"
);

renderer.setSize(
viewer.clientWidth,
viewer.clientHeight
);

viewer.appendChild(
renderer.domElement
);


/* CONTROLS */

controls=
new THREE.OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping=true;

controls.dampingFactor=.07;

controls.minDistance=3;

controls.maxDistance=18;


/* LIGHT 1 */

scene.add(
new THREE.AmbientLight(
0xffffff,
1.7
)
);


/* LIGHT 2 */

let keyLight=
new THREE.DirectionalLight(
0xffffff,
3
);

keyLight.position.set(
5,
8,
6
);

scene.add(
keyLight
);


/* LIGHT 3 */

let fillLight=
new THREE.DirectionalLight(
0xffffff,
1.8
);

fillLight.position.set(
-6,
5,
-5
);

scene.add(
fillLight
);


/* LIGHT 4 */

let rimLight=
new THREE.DirectionalLight(
0xffffff,
1.8
);

rimLight.position.set(
0,
-3,
-8
);

scene.add(
rimLight
);


/* GROUPS */

jewelleryGroup=
new THREE.Group();

stoneGroup=
new THREE.Group();

scene.add(
jewelleryGroup
);

scene.add(
stoneGroup
);


/* FIRST MODEL */

generateCAD();


window.addEventListener(
"resize",
onResize
);


animate();


document.getElementById(
"status"
).innerText=
"V2.6 Ready";

}catch(e){

showError(e);

}

}


/* =====================================
   GOLD MATERIAL
===================================== */

function getMetal(){

let value=
document.getElementById(
"metal"
).value;


if(value==="white"){

return new THREE.MeshStandardMaterial({

color:0xd9dde2,

metalness:.97,

roughness:.14

});

}


if(value==="rose"){

return new THREE.MeshStandardMaterial({

color:0xb76e79,

metalness:.97,

roughness:.16

});

}


return new THREE.MeshStandardMaterial({

color:0xd4af37,

metalness:.97,

roughness:.15

});

}


/* =====================================
   DIAMOND MATERIAL
===================================== */

function getDiamondMaterial(){

return new THREE.MeshPhysicalMaterial({

color:0xffffff,

metalness:0.0,

roughness:0.012,

transmission:0.12,

transparent:true,

opacity:.98,

reflectivity:1

});

}


/* =====================================
   DIAMOND GEOMETRY
===================================== */

function createBrilliantDiamond(
radius
){

let vertices=[];

let indices=[];


/*
   TOP POINT
*/

vertices.push(
0,
radius*1.25,
0
);


/*
   UPPER GIRDLE RING
*/

let upperY=
radius*.38;

for(
let i=0;
i<8;
i++
){

let a=
(i/8)*
Math.PI*2;

vertices.push(

Math.cos(a)*radius,

upperY,

Math.sin(a)*radius

);

}


/*
   LOWER GIRDLE RING
*/

let lowerY=
-radius*.05;

for(
let i=0;
i<8;
i++
){

let a=
(i/8)*
Math.PI*2;

vertices.push(

Math.cos(a)*radius*.86,

lowerY,

Math.sin(a)*radius*.86

);

}


/*
   BOTTOM POINT
*/

let bottomIndex=
vertices.length/3;

vertices.push(

0,

-radius*.92,

0

);


/*
   TOP FACETS
*/

for(
let i=0;
i<8;
i++
){

let next=
(i+1)%8;

indices.push(
0,
1+i,
1+next
);

}


/*
   GIRDLE FACETS
*/

for(
let i=0;
i<8;
i++
){

let next=
(i+1)%8;

let a=
1+i;

let b=
1+next;

let c=
9+i;

let d=
9+next;

indices.push(
a,
c,
b
);

indices.push(
b,
c,
d
);

}


/*
   LOWER FACETS
*/

for(
let i=0;
i<8;
i++
){

let next=
(i+1)%8;

indices.push(

9+i,
bottomIndex,
9+next

);

}


/*
   BUFFER GEOMETRY
*/

let geometry=
new THREE.BufferGeometry();

geometry.setAttribute(

"position",

new THREE.Float32BufferAttribute(
vertices,
3
)

);

geometry.setIndex(
indices
);

geometry.computeVertexNormals();

return geometry;

}


/* =====================================
   CLEAR MODEL
===================================== */

function clearModel(){

while(
jewelleryGroup.children.length>0
){

jewelleryGroup.remove(
jewelleryGroup.children[0]
);

}


while(
stoneGroup.children.length>0
){

stoneGroup.remove(
stoneGroup.children[0]
);

}

}


/* =====================================
   GENERATE CAD
===================================== */

function generateCAD(){

try{

clearModel();

let type=
document.getElementById(
"type"
).value;


if(type==="bangle"){

createBangle();

}


else if(type==="ring"){

createRing();

}


else if(type==="bracelet"){

createBracelet();

}


else if(type==="necklace"){

createNecklace();

}


else if(type==="earring"){

createEarring();

}


document.getElementById(
"status"
).innerText=
"V2.6 CAD Generated ✓";


}catch(e){

showError(e);

}

}


/* =====================================
   BANGLE
===================================== */

function createBangle(){

let size=
parseFloat(
document.getElementById(
"size"
).value
);

let thickness=
parseFloat(
document.getElementById(
"thickness"
).value
);

let count=
parseInt(
document.getElementById(
"diamondCount"
).value
);

let style=
document.getElementById(
"style"
).value;


let radius=
2.65+
(size-2.5)*1.15;


/*
   MAIN BODY
*/

let bangle=
new THREE.Mesh(

new THREE.TorusGeometry(

radius,

thickness,

48,

180

),

getMetal()

);

bangle.rotation.x=
Math.PI/2;

jewelleryGroup.add(
bangle
);


/*
   SIDE RAILS
*/

if(style!=="classic"){

let rail1=
new THREE.Mesh(

new THREE.TorusGeometry(

radius,

thickness*.16,

20,

180

),

getMetal()

);

rail1.rotation.x=
Math.PI/2;

rail1.position.y=
thickness*.65;

jewelleryGroup.add(
rail1
);


let rail2=
new THREE.Mesh(

new THREE.TorusGeometry(

radius,

thickness*.12,

20,

180

),

getMetal()

);

rail2.rotation.x=
Math.PI/2;

rail2.position.y=
-thickness*.48;

jewelleryGroup.add(
rail2
);

}


/*
   DIAMONDS
*/

if(
document.getElementById(
"stone"
).value!=="none"
&&
count>0
){

if(style==="pave"){

createPavePattern(
radius,
thickness,
count
);

}

else{

for(
let i=0;
i<count;
i++
){

let angle=
(i/count)*
Math.PI*2;

createProfessionalSetting(

Math.cos(angle)*radius,

0,

Math.sin(angle)*radius,

angle,

thickness

);

}

}

}

}


/* =====================================
   PAVÉ
===================================== */

function createPavePattern(
radius,
thickness,
count
){

let rows=2;

for(
let i=0;
i<count;
i++
){

let angle=
(i/count)*
Math.PI*2;

let row=
i%rows;

let offset=
row===0
?
-.075
:
.075;

let r=
radius+offset;

createPaveStone(

Math.cos(angle)*r,

0,

Math.sin(angle)*r,

angle,

thickness

);

}

}


/* =====================================
   PAVÉ STONE
===================================== */

function createPaveStone(
x,
y,
z,
angle,
thickness
){

let group=
new THREE.Group();

let metal=
getMetal();


/*
   BASE
*/

let base=
new THREE.Mesh(

new THREE.CylinderGeometry(
.075,
.10,
.055,
24
),

metal

);

base.position.y=
thickness+.025;

group.add(
base
);


/*
   DIAMOND
*/

let diamond=
new THREE.Mesh(

createBrilliantDiamond(
.115
),

getDiamondMaterial()

);

diamond.position.y=
thickness+.12;

group.add(
diamond
);


/*
   PRONGS
*/

for(
let i=0;
i<4;
i++
){

let a=
i*Math.PI/2+
Math.PI/4;

let prong=
new THREE.Mesh(

new THREE.CylinderGeometry(
.014,
.020,
.12,
8
),

metal

);

prong.position.set(

Math.cos(a)*.075,

thickness+.075,

Math.sin(a)*.075

);

group.add(
prong
);

}


group.position.set(
x,
y,
z
);

group.rotation.y=
-angle;

stoneGroup.add(
group
);

}


/* =====================================
   PROFESSIONAL SETTING
===================================== */

function createProfessionalSetting(
x,
y,
z,
angle,
thickness
){

let group=
new THREE.Group();

let metal=
getMetal();


/*
   SETTING CUP
*/

let cup=
new THREE.Mesh(

new THREE.CylinderGeometry(

.13,

.155,

.075,

32

),

metal

);

cup.position.y=
thickness+.035;

group.add(
cup
);


/*
   INNER SEAT
*/

let seat=
new THREE.Mesh(

new THREE.CylinderGeometry(

.105,

.105,

.025,

24

),

metal

);

seat.position.y=
thickness+.09;

group.add(
seat
);


/*
   DIAMOND SIZE
*/

let size=
document.getElementById(
"diamondSize"
).value;

let d=.17;


if(size==="small"){

d=.13;

}


if(size==="large"){

d=.22;

}


/*
   BRILLIANT DIAMOND
*/

let diamond=
new THREE.Mesh(

createBrilliantDiamond(
d
),

getDiamondMaterial()

);

diamond.position.y=
thickness+.18;

group.add(
diamond
);


/*
   FOUR PRONGS
*/

for(
let i=0;
i<4;
i++
){

let a=
i*Math.PI/2+
Math.PI/4;

let px=
Math.cos(a)*d*.78;

let pz=
Math.sin(a)*d*.78;


let prong=
new THREE.Mesh(

new THREE.CylinderGeometry(

.018,

.027,

.20,

10

),

metal

);

prong.position.set(

px,

thickness+.125,

pz

);

group.add(
prong
);

}


/*
   SHOULDER SUPPORTS
*/

for(
let i=0;
i<2;
i++
){

let side=
i===0
?
-1
:
1;


let support=
new THREE.Mesh(

new THREE.CylinderGeometry(

.022,

.032,

.15,

10

),

metal

);

support.rotation.z=
side*.48;

support.position.set(

side*.105,

thickness+.09,

0

);

group.add(
support
);

}


/*
   POSITION
*/

group.position.set(
x,
y,
z
);

group.rotation.y=
-angle;

stoneGroup.add(
group
);

}


/* =====================================
   RING
===================================== */

function createRing(){

let thickness=
parseFloat(
document.getElementById(
"thickness"
).value
);


let ring=
new THREE.Mesh(

new THREE.TorusGeometry(

1.75,

thickness,

40,

140

),

getMetal()

);

ring.rotation.x=
Math.PI/2;

jewelleryGroup.add(
ring
);


if(
document.getElementById(
"stone"
).value!=="none"
){

let setting=
new THREE.Group();

let metal=
getMetal();


let base=
new THREE.Mesh(

new THREE.CylinderGeometry(
.30,
.36,
.11,
32
),

metal

);

base.position.y=
thickness+.20;

setting.add(
base
);


let diamond=
new THREE.Mesh(

createBrilliantDiamond(
.42
),

getDiamondMaterial()

);

diamond.position.y=
thickness+.55;

setting.add(
diamond
);


/*
   RING PRONGS
*/

for(
let i=0;
i<4;
i++
){

let a=
i*Math.PI/2+
Math.PI/4;

let p=
new THREE.Mesh(

new THREE.CylinderGeometry(

.025,

.035,

.34,

10

),

metal

);

p.position.set(

Math.cos(a)*.28,

thickness+.40,

Math.sin(a)*.28

);

setting.add(
p
);

}


stoneGroup.add(
setting
);

}

}


/* =====================================
   BRACELET
===================================== */

function createBracelet(){

let thickness=
parseFloat(
document.getElementById(
"thickness"
).value
);

let radius=2.7;


let bracelet=
new THREE.Mesh(

new THREE.TorusGeometry(

radius,

thickness,

40,

150

),

getMetal()

);

bracelet.rotation.x=
Math.PI/2;

jewelleryGroup.add(
bracelet
);


let count=
parseInt(
document.getElementById(
"diamondCount"
).value
);


if(
document.getElementById(
"stone"
).value!=="none"
){

for(
let i=0;
i<count;
i++
){

let angle=
(i/count)*
Math.PI*2;


createProfessionalSetting(

Math.cos(angle)*radius,

0,

Math.sin(angle)*radius,

angle,

thickness

);

}

}

}


/* =====================================
   NECKLACE
===================================== */

function createNecklace(){

let curve=
new THREE.EllipseCurve(

0,
0,

3.2,
2.25,

0,
Math.PI*2,

false,
0

);


let points=
curve.getPoints(
140
);

let vectors=[];


for(
let p of points
){

vectors.push(

new THREE.Vector3(

p.x,

0,

p.y

)

);

}


let geometry=
new THREE.BufferGeometry()
.setFromPoints(
vectors
);


let line=
new THREE.LineLoop(

geometry,

new THREE.LineBasicMaterial({

color:getMetal().color

})

);


jewelleryGroup.add(
line
);


/*
   PENDANT
*/

if(
document.getElementById(
"stone"
).value!=="none"
){

let pendant=
new THREE.Mesh(

createBrilliantDiamond(
.55
),

getDiamondMaterial()

);

pendant.position.set(

0,

0,

2.25

);

stoneGroup.add(
pendant
);

}

}


/* =====================================
   EARRING
===================================== */

function createEarring(){

let thickness=
parseFloat(
document.getElementById(
"thickness"
).value
);


let hoop=
new THREE.Mesh(

new THREE.TorusGeometry(

1.4,

thickness,

36,

110
