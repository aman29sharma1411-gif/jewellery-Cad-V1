<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jewellery CAD AI V2.6.1</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#080808;
 color:white;
 font-family:Arial,sans-serif
}

header{
 height:60px;
 display:flex;
 align-items:center;
 padding:0 18px;
 background:#151515;
 border-bottom:1px solid #333;
 font-size:21px;
 font-weight:bold
}

.container{
 max-width:950px;
 margin:auto;
 padding:12px
}

.controls{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.box,.reference{
 background:#171717;
 border-radius:12px;
 padding:14px
}

label{
 display:block;
 color:#aaa;
 font-size:16px;
 margin-bottom:9px
}

select,input[type=file]{
 width:100%;
 padding:13px;
 background:#242424;
 color:white;
 border:1px solid #444;
 border-radius:9px;
 font-size:16px
}

input[type=range]{
 width:100%
}

.value{
 text-align:center;
 font-size:18px;
 margin-top:8px
}

button{
 width:100%;
 padding:15px;
 margin-top:10px;
 border:0;
 border-radius:10px;
 font-size:18px;
 font-weight:bold;
 background:#dcb536;
 color:#111
}

button.secondary{
 background:#333;
 color:white
}

.viewButtons{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:8px
}

.viewButtons button{
 font-size:14px
}

.reference{
 margin-top:10px
}

#preview{
 display:none;
 width:100%;
 max-height:180px;
 object-fit:contain;
 margin-top:10px;
 border-radius:8px
}

.viewer{
 position:relative;
 height:500px;
 margin-top:12px;
 background:#010101;
 border:1px solid #333;
 border-radius:14px;
 overflow:hidden
}

#viewer{
 width:100%;
 height:100%
}

.status{
 position:absolute;
 z-index:5;
 top:10px;
 left:10px;
 background:rgba(0,0,0,.75);
 padding:8px 12px;
 border-radius:8px;
 font-size:13px
}

.info{
 margin-top:10px;
 padding:10px;
 background:#121212;
 border-radius:9px;
 color:#aaa;
 font-size:13px;
 text-align:center
}

@media(max-width:600px){
 .viewer{height:470px}
}
</style>
</head>

<body>

<header>
💎 Jewellery CAD AI V2.6.1
</header>

<div class="container">

<div class="controls">

<div class="box">
<label>Jewellery Type</label>
<select id="type">
<option value="bangle">Bangle</option>
<option value="ring">Ring</option>
<option value="bracelet">Bracelet</option>
<option value="necklace">Necklace</option>
<option value="earring">Earring</option>
</select>
</div>

<div class="box">
<label>Metal</label>
<select id="metal">
<option value="yellow">Yellow Gold</option>
<option value="white">White Gold</option>
<option value="rose">Rose Gold</option>
</select>
</div>

<div class="box">
<label>Stone</label>
<select id="stone">
<option value="diamond">Diamond</option>
<option value="solitaire">Solitaire</option>
<option value="none">None</option>
</select>
</div>

<div class="box">
<label>Design Style</label>
<select id="style">
<option value="classic">Classic</option>
<option value="pave">Pavé</option>
<option value="solitaire">Solitaire</option>
</select>
</div>

<div class="box">
<label>Size</label>
<select id="size">
<option value="2.2">2.2</option>
<option value="2.4">2.4</option>
<option value="2.5" selected>2.5</option>
<option value="2.6">2.6</option>
<option value="2.8">2.8</option>
<option value="3.0">3.0</option>
</select>
</div>

<div class="box">
<label>Thickness</label>
<input id="thickness" type="range"
min="0.16" max="0.50" step="0.01" value="0.28">
<div class="value" id="thicknessValue">0.28</div>
</div>

<div class="box">
<label>Diamonds</label>
<input id="diamondCount" type="range"
min="0" max="60" step="1" value="24">
<div class="value" id="diamondValue">24</div>
</div>

<div class="box">
<label>Diamond Size</label>
<select id="diamondSize">
<option value="small">Small</option>
<option value="medium" selected>Medium</option>
<option value="large">Large</option>
</select>
</div>

</div>

<div class="reference">
<label>Reference Photo</label>
<input id="reference" type="file" accept="image/*">
<img id="preview">
</div>

<button id="generate">
✨ Generate CAD
</button>

<button class="secondary" id="reset">
↻ Reset
</button>

<button class="secondary" id="stones">
💎 Show / Hide Stones
</button>

<div class="viewButtons">
<button class="secondary" id="front">Front</button>
<button class="secondary" id="top">Top</button>
<button class="secondary" id="view3d">3D View</button>
</div>

<div class="viewer">

<div class="status" id="status">
V2.6.1 Live Preview
</div>

<div id="viewer"></div>

</div>

<div class="info">
👆 Drag = Rotate &nbsp; • &nbsp;
🤏 Pinch = Zoom &nbsp; • &nbsp;
2 Fingers = Pan
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

let scene,camera,renderer,controls;

let jewelleryGroup;
let stoneGroup;

let stonesVisible=true;


/* =========================
   INIT
========================= */

function init(){

scene=new THREE.Scene();
scene.background=new THREE.Color(0x010101);

const viewer=document.getElementById("viewer");

camera=new THREE.PerspectiveCamera(
45,
viewer.clientWidth/viewer.clientHeight,
0.1,
1000
);

camera.position.set(0,4.5,8);

renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
viewer.clientWidth,
viewer.clientHeight
);

viewer.appendChild(renderer.domElement);


/* CONTROLS */

controls=new THREE.OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping=true;
controls.dampingFactor=.07;
controls.minDistance=3;
controls.maxDistance=16;


/* LIGHTS */

scene.add(
new THREE.AmbientLight(
0xffffff,1.8
)
);

let light1=new THREE.DirectionalLight(
0xffffff,3
);

light1.position.set(5,8,6);
scene.add(light1);

let light2=new THREE.DirectionalLight(
0xffffff,2
);

light2.position.set(-6,4,-5);
scene.add(light2);

let light3=new THREE.DirectionalLight(
0xffffff,1.5
);

light3.position.set(0,-4,-7);
scene.add(light3);


/* GROUPS */

jewelleryGroup=new THREE.Group();
stoneGroup=new THREE.Group();

scene.add(jewelleryGroup);
scene.add(stoneGroup);


/* FIRST LIVE MODEL */

generateCAD();


/* EVENTS */

window.addEventListener(
"resize",
resize
);

animate();

}


/* =========================
   METAL
========================= */

function metalMaterial(){

let metal=
document.getElementById("metal").value;

if(metal==="white"){

return new THREE.MeshStandardMaterial({
color:0xd9dde2,
metalness:.98,
roughness:.13
});

}

if(metal==="rose"){

return new THREE.MeshStandardMaterial({
color:0xc47b83,
metalness:.98,
roughness:.15
});

}

return new THREE.MeshStandardMaterial({
color:0xd4af37,
metalness:.98,
roughness:.14
});

}


/* =========================
   DIAMOND
========================= */

function diamondMaterial(){

return new THREE.MeshPhysicalMaterial({

color:0xffffff,
metalness:0,
roughness:.01,
transmission:.15,
transparent:true,
opacity:.98,
reflectivity:1

});

}


/* =========================
   DIAMOND GEOMETRY
========================= */

function diamondGeometry(r){

let v=[];
let ind=[];


/* top */

v.push(0,r*1.3,0);


/* upper */

for(let i=0;i<8;i++){

let a=i*Math.PI*2/8;

v.push(
Math.cos(a)*r,
r*.38,
Math.sin(a)*r
);

}


/* lower */

for(let i=0;i<8;i++){

let a=i*Math.PI*2/8;

v.push(
Math.cos(a)*r*.86,
-r*.05,
Math.sin(a)*r*.86
);

}


/* bottom */

let bottom=v.length/3;

v.push(
0,
-r*.9,
0
);


/* top facets */

for(let i=0;i<8;i++){

let n=(i+1)%8;

ind.push(
0,
1+i,
1+n
);

}


/* middle */

for(let i=0;i<8;i++){

let n=(i+1)%8;

let a=1+i;
let b=1+n;
let c=9+i;
let d=9+n;

ind.push(a,c,b);
ind.push(b,c,d);

}


/* bottom */

for(let i=0;i<8;i++){

let n=(i+1)%8;

ind.push(
9+i,
bottom,
9+n
);

}

let g=new THREE.BufferGeometry();

g.setAttribute(
"position",
new THREE.Float32BufferAttribute(v,3)
);

g.setIndex(ind);

g.computeVertexNormals();

return g;

}


/* =========================
   CLEAR
========================= */

function clear(){

while(jewelleryGroup.children.length)
jewelleryGroup.remove(
jewelleryGroup.children[0]
);

while(stoneGroup.children.length)
stoneGroup.remove(
stoneGroup.children[0]
);

}


/* =========================
   GENERATE
========================= */

function generateCAD(){

clear();

let type=
document.getElementById("type").value;

if(type==="bangle")
createBangle();

if(type==="ring")
createRing();

if(type==="bracelet")
createBracelet();

if(type==="necklace")
createNecklace();

if(type==="earring")
createEarring();

document.getElementById("status").innerText=
"V2.6.1 Live CAD ✓";

}


/* =========================
   BANGLE
========================= */

function createBangle(){

let size=parseFloat(
document.getElementById("size").value
);

let thickness=parseFloat(
document.getElementById("thickness").value
);

let count=parseInt(
document.getElementById("diamondCount").value
);

let style=
document.getElementById("style").value;


/* radius */

let radius=
2.65+(size-2.5)*1.15;


/* MAIN BANGLE */

let body=new THREE.Mesh(

new THREE.TorusGeometry(
radius,
thickness,
48,
180
),

metalMaterial()

);

body.rotation.x=Math.PI/2;

jewelleryGroup.add(body);


/* SIDE RAILS */

if(style==="pave" || style==="solitaire"){

let rail1=new THREE.Mesh(

new THREE.TorusGeometry(
radius,
thickness*.15,
24,
180
),

metalMaterial()

);

rail1.rotation.x=Math.PI/2;
rail1.position.y=thickness*.65;

jewelleryGroup.add(rail1);


let rail2=new THREE.Mesh(

new THREE.TorusGeometry(
radius,
thickness*.12,
24,
180
),

metalMaterial()

);

rail2.rotation.x=Math.PI/2;
rail2.position.y=-thickness*.55;

jewelleryGroup.add(rail2);

}


/* STONES */

let stone=
document.getElementById("stone").value;

if(stone==="none" || count===0)
return;


/* PAVE */

if(style==="pave"){

for(let i=0;i<count;i++){

let angle=i/count*Math.PI*2;

let r=radius;

createSetting(
Math.cos(angle)*r,
0,
Math.sin(angle)*r,
angle,
thickness
);

}

return;

}


/* CLASSIC */

if(style==="classic"){

for(let i=0;i<count;i++){

let angle=i/count*Math.PI*2;

createSetting(
Math.cos(angle)*radius,
0,
Math.sin(angle)*radius,
angle,
thickness
);

}

return;

}


/* SOLITAIRE */

if(style==="solitaire"){

let angle=Math.PI/2;

createSetting(
Math.cos(angle)*radius,
0,
Math.sin(angle)*radius,
angle,
thickness
);

}

}


/* =========================
   SETTING
========================= */

function createSetting(
x,y,z,angle,thickness
){

let group=new THREE.Group();

let metal=metalMaterial();


/* BASE */

let base=new THREE.Mesh(

new THREE.CylinderGeometry(
.14,
.17,
.075,
32
),

metal

);

base.position.y=
thickness+.04;

group.add(base);


/* DIAMOND SIZE */

let ds=
document.getElementById("diamondSize").value;

let r=.17;

if(ds==="small")
r=.125;

if(ds==="large")
r=.22;


/* DIAMOND */

let diamond=new THREE.Mesh(

diamondGeometry(r),
diamondMaterial()

);

diamond.position.y=
thickness+.18;

group.add(diamond);


/* 4 PRONGS */

for(let i=0;i<4;i++){

let a=
i*Math.PI/2+
Math.PI/4;

let prong=new THREE.Mesh(

new THREE.CylinderGeometry(
.018,
.027,
.21,
10
),

metal

);

prong.position.set(

Math.cos(a)*r*.78,

thickness+.13,

Math.sin(a)*r*.78

);

group.add(prong);

}


/* SMALL SUPPORTS */

for(let i=0;i<2;i++){

let side=i===0?-1:1;

let support=new THREE.Mesh(

new THREE.CylinderGeometry(
.022,
.03,
.15,
10
),

metal

);

support.rotation.z=
side*.5;

support.position.set(
side*.11,
thickness+.09,
0
);

group.add(support);

}


/* POSITION */

group.position.set(x,y,z);

group.rotation.y=-angle;

stoneGroup.add(group);

}


/* =========================
   RING
========================= */

function createRing(){

let t=parseFloat(
document.getElementById("thickness").value
);

let ring=new THREE.Mesh(

new THREE.TorusGeometry(
1.7,
t,
40,
140
),

metalMaterial()

);

ring.rotation.x=Math.PI/2;

jewelleryGroup.add(ring);


let stone=
document.getElementById("stone").value;

if(stone==="none")
return;


let group=new THREE.Group();

let base=new THREE.Mesh(

new THREE.CylinderGeometry(
.3,.36,.1,32
),

metalMaterial()

);

base.position.y=t+.2;

group.add(base);


let diamond=new THREE.Mesh(

diamondGeometry(.4),
diamondMaterial()

);

diamond.position.y=t+.55;

group.add(diamond);

stoneGroup.add(group);

}


/* =========================
   BRACELET
========================= */

function createBracelet(){

let t=parseFloat(
document.getElementById("thickness").value
);

let radius=2.7;

let b=new THREE.Mesh(

new THREE.TorusGeometry(
radius,
t,
40,
150
),

metalMaterial()

);

b.rotation.x=Math.PI/2;

jewelleryGroup.add(b);


let count=parseInt(
document.getElementById("diamondCount").value
);

if(document.getElementById("stone").value==="none")
return;

for(let i=0;i<count;i++){

let a=i/count*Math.PI*2;

createSetting(
Math.cos(a)*radius,
0,
Math.sin(a)*radius,
a,
t
);

}

}


/* =========================
   NECKLACE
========================= */

function createNecklace(){

let curve=new THREE.EllipseCurve(
0,0,
3.2,2.25,
0,Math.PI*2,
false,0
);

let points=curve.getPoints(150);

let pts=[];

points.forEach(p=>{

pts.push(
new THREE.Vector3(
p.x,0,p.y
)
);

});

let geo=
new THREE.BufferGeometry()
.setFromPoints(pts);

let line=new THREE.LineLoop(

geo,

new THREE.LineBasicMaterial({
color:0xd4af37
})

);

jewelleryGroup.add(line);


/* pendant */

if(document.getElementById("stone").value!=="none"){

let d=new THREE.Mesh(
diamondGeometry(.5),
diamondMaterial()
);

d.position.set(0,0,2.25);

stoneGroup.add(d);

}

}


/* =========================
   EARRING
========================= */

function createEarring(){

let t=parseFloat(
document.getElementById("thickness").value
);

let hoop=new THREE.Mesh(

new THREE.TorusGeometry(
1.4,t,36,120
),

metalMaterial()

);

hoop.rotation.x=Math.PI/2;

jewelleryGroup.add(hoop);


if(document.getElementById("stone").value!=="none"){

let d=new THREE.Mesh(
diamondGeometry(.36),
diamondMaterial()
);

d.position.y=t+.4;

stoneGroup.add(d);

}

}


/* =========================
   AUTO LIVE UPDATE
========================= */

function liveUpdate(){

document.getElementById("thicknessValue").innerText=
document.getElementById("thickness").value;

document.getElementById("diamondValue").innerText=
document.getElementById("diamondCount").value;

generateCAD();

}


/* =========================
   BUTTON
========================= */

document.getElementById("generate")
.addEventListener(
"click",
generateCAD
);


/* =========================
   RESET
========================= */

document.getElementById("reset")
.addEventListener(
"click",
function(){

document.getElementById("type").value="bangle";
document.getElementById("metal").value="yellow";
document.getElementById("stone").value="diamond";
document.getElementById("style").value="classic";
document.getElementById("size").value="2.5";
document.getElementById("thickness").value=".28";
document.getElementById("diamondCount").value="24";
document.getElementById("diamondSize").value="medium";

document.getElementById("thicknessValue").innerText=".28";
document.getElementById("diamondValue").innerText="24";

stonesVisible=true;
stoneGroup.visible=true;

resetView();

generateCAD();

}
);


/* =========================
   LIVE CONTROLS
========================= */

[
"type",
"metal",
"stone",
"style",
"size",
"thickness",
"diamondCount",
"diamondSize"
].forEach(id=>{

document.getElementById(id)
.addEventListener("input",liveUpdate);

document.getElementById(id)
.addEventListener("change",liveUpdate);

});


/* =========================
   STONES
========================= */

document.getElementById("stones")
.addEventListener(
"click",
function(){

stonesVisible=!stonesVisible;

stoneGroup.visible=stonesVisible;

document.getElementById("status").innerText=
stonesVisible
?
"💎 Stones Visible"
:
"Stones Hidden";

}
);


/* =========================
   FRONT
========================= */

document.getElementById("front")
.addEventListener(
"click",
function(){

camera.position.set(
0,0,9
);

controls.target.set(0,0,0);
controls.update();

}
);


/* =========================
   TOP
========================= */

document.getElementById("top")
.addEventListener(
"click",
function(){

camera.position.set(
0,9,0
);

controls.target.set(0,0,0);
controls.update();

}
);


/* =========================
   3D VIEW
========================= */

document.getElementById("view3d")
.addEventListener(
"click",
resetView
);

function resetView(){

camera.position.set(
0,4.5,8
);

controls.target.set(
0,0,0
);

controls.update();

}


/* =========================
   REFERENCE PHOTO
========================= */

document.getElementById("reference")
.addEventListener(
"change",
function(){

let file=this.files[0];

if(!file)
return;

let img=document.getElementById("preview");

img.src=
URL.createObjectURL(file);

img.style.display="block";

}
);


/* =========================
   RESIZE
========================= */

function resize(){

let viewer=
document.getElementById("viewer");

camera.aspect=
viewer.clientWidth/
viewer.clientHeight;

camera.updateProjectionMatrix();

renderer.setSize(
viewer.clientWidth,
viewer.clientHeight
);

}


/* =========================
   ANIMATE
========================= */

function animate(){

requestAnimationFrame(animate);

controls.update();

renderer.render(
scene,
camera
);

}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
