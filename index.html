<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jewellery CAD AI V2.5</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090909;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  height:58px;
  background:#151515;
  display:flex;
  align-items:center;
  padding:0 15px;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #333;
}

.container{
  max-width:950px;
  margin:auto;
  padding:12px;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.box,.reference{
  background:#171717;
  border-radius:11px;
  padding:11px;
}

label{
  display:block;
  color:#bbb;
  font-size:13px;
  margin-bottom:6px;
}

select,input{
  width:100%;
  padding:11px;
  border-radius:8px;
  border:1px solid #444;
  background:#242424;
  color:#fff;
}

button{
  width:100%;
  border:0;
  border-radius:9px;
  padding:13px;
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  background:#d8b437;
  color:#111;
}

button.secondary{
  background:#333;
  color:white;
}

.reference{
  margin-top:10px;
}

#preview{
  display:none;
  width:100%;
  max-height:180px;
  object-fit:contain;
  margin-top:8px;
  border-radius:8px;
}

.viewer{
  height:500px;
  margin-top:12px;
  background:#010101;
  border:1px solid #333;
  border-radius:13px;
  overflow:hidden;
  position:relative;
}

#viewer{
  width:100%;
  height:100%;
}

.status{
  position:absolute;
  z-index:5;
  top:10px;
  left:10px;
  padding:7px 10px;
  border-radius:7px;
  background:rgba(0,0,0,.75);
  font-size:12px;
}

.error{
  display:none;
  position:absolute;
  z-index:20;
  top:50px;
  left:10px;
  right:10px;
  padding:12px;
  border-radius:8px;
  background:#421414;
  color:#ffb4b4;
  font-size:13px;
}

@media(max-width:600px){
  .viewer{height:430px}
}
</style>
</head>

<body>

<header>
💎 Jewellery CAD AI V2.5
</header>

<div class="container">

<div class="controls">

<div class="box">
<label>Jewellery Type</label>
<select id="type">
<option value="bangle">Bangle</option>
<option value="ring">Ring</option>
<option value="bracelet">Bracelet</option>
<option value="necklace">Necklace</option>
<option value="earring">Earring</option>
</select>
</div>

<div class="box">
<label>Metal</label>
<select id="metal">
<option value="yellow">Yellow Gold</option>
<option value="white">White Gold</option>
<option value="rose">Rose Gold</option>
</select>
</div>

<div class="box">
<label>Stone</label>
<select id="stone">
<option value="diamond">Diamond</option>
<option value="solitaire">Solitaire</option>
<option value="none">None</option>
</select>
</div>

<div class="box">
<label>Design Style</label>
<select id="style">
<option value="classic">Classic</option>
<option value="pave">Pavé</option>
<option value="solitaire">Solitaire</option>
</select>
</div>

<div class="box">
<label>Size</label>
<select id="size">
<option value="2.2">2.2</option>
<option value="2.4">2.4</option>
<option value="2.5" selected>2.5</option>
<option value="2.6">2.6</option>
<option value="2.8">2.8</option>
<option value="3.0">3.0</option>
</select>
</div>

<div class="box">
<label>Thickness</label>
<input
 id="thickness"
 type="range"
 min="0.16"
 max="0.50"
 step="0.01"
 value="0.28"
 oninput="thicknessValue.innerText=this.value">

<div style="text-align:center;margin-top:5px">
<span id="thicknessValue">0.28</span>
</div>
</div>

<div class="box">
<label>Diamonds</label>
<input
 id="diamondCount"
 type="range"
 min="0"
 max="48"
 step="1"
 value="24"
 oninput="diamondValue.innerText=this.value">

<div style="text-align:center;margin-top:5px">
<span id="diamondValue">24</span>
</div>
</div>

<div class="box">
<label>Diamond Size</label>
<select id="diamondSize">
<option value="small">Small</option>
<option value="medium" selected>Medium</option>
<option value="large">Large</option>
</select>
</div>

</div>

<div class="reference">

<label>Reference Photo</label>

<input
 type="file"
 id="reference"
 accept="image/*">

<img id="preview">

</div>

<button onclick="generateCAD()">
✨ Generate CAD
</button>

<button class="secondary" onclick="resetCAD()">
↻ Reset
</button>

<button class="secondary" onclick="toggleStones()">
💎 Show / Hide Stones
</button>

<div class="viewer">

<div class="status" id="status">
V2.5 Starting...
</div>

<div class="error" id="error"></div>

<div id="viewer"></div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


<script>

let scene;
let camera;
let renderer;
let controls;

let jewelleryGroup;
let stoneGroup;

let stonesVisible=true;


/* =========================
   INITIALIZE
========================= */

function init(){

try{

scene=new THREE.Scene();

scene.background=
new THREE.Color(0x030303);


camera=
new THREE.PerspectiveCamera(
45,
1,
0.1,
1000
);

camera.position.set(
0,
4.8,
8
);


renderer=
new THREE.WebGLRenderer({
antialias:true
});

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

let viewer=
document.getElementById("viewer");

renderer.setSize(
viewer.clientWidth,
viewer.clientHeight
);

viewer.appendChild(
renderer.domElement
);


controls=
new THREE.OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping=true;
controls.dampingFactor=.07;
controls.minDistance=3;
controls.maxDistance=16;


/* LIGHTS */

scene.add(
new THREE.AmbientLight(
0xffffff,
1.7
)
);

let key=
new THREE.DirectionalLight(
0xffffff,
2.8
);

key.position.set(
5,8,6
);

scene.add(key);

let fill=
new THREE.DirectionalLight(
0xffffff,
1.5
);

fill.position.set(
-6,4,-5
);

scene.add(fill);

let top=
new THREE.PointLight(
0xffffff,
1.5,
30
);

top.position.set(
0,6,2
);

scene.add(top);


/* GROUPS */

jewelleryGroup=
new THREE.Group();

stoneGroup=
new THREE.Group();

scene.add(jewelleryGroup);
scene.add(stoneGroup);


/* GENERATE */

generateCAD();


window.addEventListener(
"resize",
onResize
);

animate();

document.getElementById("status")
.innerText="V2.5 Ready";

}catch(e){

showError(e);

}

}


/* =========================
   METAL
========================= */

function getMetal(){

let value=
document.getElementById("metal").value;

if(value==="white"){

return new THREE.MeshStandardMaterial({
color:0xd9dde2,
metalness:.96,
roughness:.15
});

}

if(value==="rose"){

return new THREE.MeshStandardMaterial({
color:0xb76e79,
metalness:.96,
roughness:.17
});

}

return new THREE.MeshStandardMaterial({
color:0xd4af37,
metalness:.97,
roughness:.16
});

}


/* =========================
   DIAMOND
========================= */

function getDiamondMaterial(){

return new THREE.MeshPhysicalMaterial({

color:0xffffff,

metalness:.02,

roughness:.015,

transparent:true,

opacity:.97

});

}


/* =========================
   CLEAR
========================= */

function clearModel(){

while(
jewelleryGroup.children.length>0
){

jewelleryGroup.remove(
jewelleryGroup.children[0]
);

}

while(
stoneGroup.children.length>0
){

stoneGroup.remove(
stoneGroup.children[0]
);

}

}


/* =========================
   GENERATE
========================= */

function generateCAD(){

try{

clearModel();

let type=
document.getElementById("type").value;

if(type==="bangle"){
createBangle();
}

else if(type==="ring"){
createRing();
}

else if(type==="bracelet"){
createBracelet();
}

else if(type==="necklace"){
createNecklace();
}

else if(type==="earring"){
createEarring();
}

document.getElementById("status")
.innerText="V2.5 CAD Generated ✓";

}catch(e){

showError(e);

}

}


/* =========================
   BANGLE
========================= */

function createBangle(){

let size=
parseFloat(
document.getElementById("size").value
);

let thickness=
parseFloat(
document.getElementById("thickness").value
);

let count=
parseInt(
document.getElementById("diamondCount").value
);

let designStyle=
document.getElementById("style").value;

let radius=
2.65+(size-2.5)*1.15;


/* MAIN GOLD BODY */

let bangle=
new THREE.Mesh(

new THREE.TorusGeometry(
radius,
thickness,
48,
180
),

getMetal()

);

bangle.rotation.x=
Math.PI/2;

jewelleryGroup.add(bangle);


/* TOP RAIL */

if(designStyle!=="classic"){

let rail=
new THREE.Mesh(

new THREE.TorusGeometry(
radius,
thickness*.18,
20,
180
),

getMetal()

);

rail.rotation.x=
Math.PI/2;

rail.position.y=
thickness*.78;

jewelleryGroup.add(rail);

}


/* STONES */

if(
document.getElementById("stone").value!=="none"
&& count>0
){

if(designStyle==="pave"){

createPaveBangle(
radius,
thickness,
count
);

}else{

for(let i=0;i<count;i++){

let angle=
(i/count)*Math.PI*2;

createSetting(
Math.cos(angle)*radius,
0,
Math.sin(angle)*radius,
angle,
thickness
);

}

}

}

}


/* =========================
   PAVE
========================= */

function createPaveBangle(
radius,
thickness,
count
){

let rows=2;

let total=count;

for(let i=0;i<total;i++){

let angle=
(i/total)*Math.PI*2;

let row=
i%rows;

let offset=
(row===0?-0.075:0.075);

let r=
radius+offset;

let x=
Math.cos(angle)*r;

let z=
Math.sin(angle)*r;

createPaveStone(
x,
0,
z,
angle,
thickness
);

}

}


/* =========================
   PAVE STONE
========================= */

function createPaveStone(
x,y,z,angle,thickness
){

let group=
new THREE.Group();

let metal=
getMetal();

let base=
new THREE.Mesh(

new THREE.CylinderGeometry(
.075,
.09,
.045,
20
),

metal

);

base.position.y=
thickness+.025;

group.add(base);


let diamond=
new THREE.Mesh(

new THREE.OctahedronGeometry(
.115,
1
),

getDiamondMaterial()

);

diamond.scale.y=1.12;

diamond.position.y=
thickness+.12;

group.add(diamond);


/* SMALL PRONGS */

for(let i=0;i<4;i++){

let a=
i*Math.PI/2+
Math.PI/4;

let prong=
new THREE.Mesh(

new THREE.CylinderGeometry(
.014,
.019,
.11,
8
),

metal

);

prong.position.set(
Math.cos(a)*.075,
thickness+.075,
Math.sin(a)*.075
);

group.add(prong);

}


group.position.set(
x,y,z
);

group.rotation.y=
-angle;

stoneGroup.add(group);

}


/* =========================
   STANDARD SETTING
========================= */

function createSetting(
x,y,z,angle,thickness
){

let group=
new THREE.Group();

let metal=
getMetal();


/* SETTING CUP */

let cup=
new THREE.Mesh(

new THREE.CylinderGeometry(
.12,
.145,
.065,
24
),

metal

);

cup.position.y=
thickness+.035;

group.add(cup);


/* DIAMOND SIZE */

let size=
document.getElementById("diamondSize").value;

let d=.17;

if(size==="small") d=.13;
if(size==="large") d=.21;


/* DIAMOND */

let diamond=
new THREE.Mesh(

new THREE.OctahedronGeometry(
d,
2
),

getDiamondMaterial()

);

diamond.scale.y=1.18;

diamond.position.y=
thickness+.19;

group.add(diamond);


/* 4 PRONGS */

for(let i=0;i<4;i++){

let a=
i*Math.PI/2+
Math.PI/4;

let px=
Math.cos(a)*d*.78;

let pz=
Math.sin(a)*d*.78;

let prong=
new THREE.Mesh(

new THREE.CylinderGeometry(
.018,
.026,
.18,
10
),

metal

);

prong.position.set(
px,
thickness+.12,
pz
);

group.add(prong);

}


/* TWO SUPPORT SHOULDERS */

for(let i=0;i<2;i++){

let side=
i===0?-1:1;

let support=
new THREE.Mesh(

new THREE.CylinderGeometry(
.022,
.032,
.14,
10
),

metal

);

support.rotation.z=
side*.48;

support.position.set(
side*.10,
thickness+.09,
0
);

group.add(support);

}


group.position.set(
x,y,z
);

group.rotation.y=
-angle;

stoneGroup.add(group);

}


/* =========================
   RING
========================= */

function createRing(){

let thickness=
parseFloat(
document.getElementById("thickness").value
);

let ring=
new THREE.Mesh(

new THREE.TorusGeometry(
1.75,
thickness,
40,
140
),

getMetal()

);

ring.rotation.x=
Math.PI/2;

jewelleryGroup.add(ring);


if(
document.getElementById("stone").value!=="none"
){

let group=
new THREE.Group();

let base=
new THREE.Mesh(

new THREE.CylinderGeometry(
.28,
.34,
.10,
32
),

getMetal()

);

base.position.y=
thickness+.20;

group.add(base);


let diamond=
new THREE.Mesh(

new THREE.OctahedronGeometry(
.42,
2
),

getDiamondMaterial()

);

diamond.scale.y=1.15;

diamond.position.y=
thickness+.52;

group.add(diamond);


/* PRONGS */

for(let i=0;i<4;i++){

let a=
i*Math.PI/2+
Math.PI/4;

let p=
new THREE.Mesh(

new THREE.CylinderGeometry(
.025,
.035,
.32,
10
),

getMetal()

);

p.position.set(
Math.cos(a)*.28,
thickness+.40,
Math.sin(a)*.28
);

group.add(p);

}

stoneGroup.add(group);

}

}


/* =========================
   BRACELET
========================= */

function createBracelet(){

let thickness=
parseFloat(
document.getElementById("thickness").value
);

let radius=2.7;

let bracelet=
new THREE.Mesh(

new THREE.TorusGeometry(
radius,
thickness,
40,
150
),

getMetal()

);

bracelet.rotation.x=
Math.PI/2;

jewelleryGroup.add(bracelet);


let count=
parseInt(
document.getElementById("diamondCount").value
);

if(
document.getElementById("stone").value!=="none"
){

for(let i=0;i<count;i++){

let angle=
(i/count)*Math.PI*2;

createSetting(
Math.cos(angle)*radius,
0,
Math.sin(angle)*radius,
angle,
thickness
);

}

}

}


/* =========================
   NECKLACE
========================= */

function createNecklace(){

let curve=
new THREE.EllipseCurve(
0,
0,
3.2,
2.25,
0,
Math.PI*2,
false,
0
);

let points=
curve.getPoints(140);

let vectors=[];

for(let p of points){

vectors.push(
new THREE.Vector3(
p.x,
0,
p.y
)
);

}

let geometry=
new THREE.BufferGeometry()
.setFromPoints(vectors);

let line=
new THREE.LineLoop(

geometry,

new THREE.LineBasicMaterial({
color:getMetal().color
})

);

jewelleryGroup.add(line);


if(
document.getElementById("stone").value!=="none"
){

let pendant=
new THREE.Mesh(

new THREE.OctahedronGeometry(
.55,
2
),

getDiamondMaterial()

);

pendant.position.set(
0,
0,
2.25
);

stoneGroup.add(pendant);

}

}


/* =========================
   EARRING
========================= */

function createEarring(){

let thickness=
parseFloat(
document.getElementById("thickness").value
);

let hoop=
new THREE.Mesh(

new THREE.TorusGeometry(
1.4,
thickness,
36,
110
),

getMetal()

);

hoop.rotation.x=
Math.PI/2;

jewelleryGroup.add(hoop);


if(
document.getElementById("stone").value!=="none"
){

let diamond=
new THREE.Mesh(

new THREE.OctahedronGeometry(
.38,
2
),

getDiamondMaterial()

);

diamond.position.y=
thickness+.45;

stoneGroup.add(diamond);

}

}


/* =========================
   SHOW / HIDE
========================= */

function toggleStones(){

stonesVisible=
!stonesVisible;

stoneGroup.visible=
stonesVisible;

document.getElementById("status")
.innerText=
stonesVisible
?
"Stones Visible"
:
"Stones Hidden";

}


/* =========================
   RESET
========================= */

function resetCAD(){

document.getElementById("type")
.value="bangle";

document.getElementById("metal")
.value="yellow";

document.getElementById("stone")
.value="diamond";

document.getElementById("style")
.value="classic";

document.getElementById("size")
.value="2.5";

document.getElementById("thickness")
.value="0.28";

document.getElementById("thicknessValue")
.innerText="0.28";

document.getElementById("diamondCount")
.value="24";

document.getElementById("diamondValue")
.innerText="24";

document.getElementById("diamondSize")
.value="medium";

stonesVisible=true;

stoneGroup.visible=true;

generateCAD();

}


/* =========================
   PHOTO PREVIEW
========================= */

document.getElementById("reference")
.addEventListener(
"change",
function(){

let file=this.files[0];

if(!file)return;

let url=
URL.createObjectURL(file);

let img=
document.getElementById("preview");

img.src=url;

img.style.display="block";

}
);


/* =========================
   RESIZE
========================= */

function onResize(){

let viewer=
document.getElementById("viewer");

let w=
viewer.clientWidth;

let h=
viewer.clientHeight;

camera.aspect=
w/h;

camera.updateProjectionMatrix();

renderer.setSize(
w,
h
);

}


/* =========================
   ANIMATION
========================= */

function animate(){

requestAnimationFrame(
animate
);

if(controls){
controls.update();
}

if(renderer && scene && camera){

renderer.render(
scene,
camera
);

}

}


/* =========================
   ERROR
========================= */

function showError(e){

let error=
document.getElementById("error");

error.style.display="block";

error.innerText=
"CAD Error: "+e.message;

document.getElementById("status")
.innerText="Error";

console.error(e);

}


/* =========================
   START
========================= */

init();

</script>

</body>
 </html>
