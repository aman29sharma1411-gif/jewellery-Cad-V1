<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jewellery CAD AI V2.4</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#090909;
 color:#fff;
 font-family:Arial,sans-serif;
}

header{
 height:58px;
 background:#151515;
 display:flex;
 align-items:center;
 padding:0 15px;
 font-size:20px;
 font-weight:bold;
 border-bottom:1px solid #333;
}

.container{
 max-width:950px;
 margin:auto;
 padding:12px;
}

.controls{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.box,.reference{
 background:#171717;
 border-radius:11px;
 padding:11px;
}

label{
 display:block;
 color:#bbb;
 font-size:13px;
 margin-bottom:6px;
}

select,input{
 width:100%;
 padding:11px;
 border-radius:8px;
 border:1px solid #444;
 background:#242424;
 color:#fff;
}

button{
 width:100%;
 border:0;
 border-radius:9px;
 padding:13px;
 margin-top:10px;
 font-size:16px;
 font-weight:bold;
 background:#d8b437;
 color:#111;
}

button.secondary{
 background:#333;
 color:white;
}

.reference{
 margin-top:10px;
}

#preview{
 display:none;
 width:100%;
 max-height:180px;
 object-fit:contain;
 margin-top:8px;
 border-radius:8px;
}

.viewer{
 height:500px;
 margin-top:12px;
 background:#010101;
 border:1px solid #333;
 border-radius:13px;
 overflow:hidden;
 position:relative;
}

#viewer{
 width:100%;
 height:100%;
}

.status{
 position:absolute;
 z-index:5;
 top:10px;
 left:10px;
 padding:7px 10px;
 border-radius:7px;
 background:rgba(0,0,0,.72);
 font-size:12px;
}

.error{
 display:none;
 position:absolute;
 z-index:20;
 top:50px;
 left:10px;
 right:10px;
 padding:12px;
 border-radius:8px;
 background:#421414;
 color:#ffb4b4;
 font-size:13px;
}

@media(max-width:600px){
 .viewer{height:430px}
}
</style>
</head>

<body>

<header>💎 Jewellery CAD AI V2.4</header>

<div class="container">

<div class="controls">

<div class="box">
<label>Jewellery Type</label>
<select id="type">
<option value="bangle">Bangle</option>
<option value="ring">Ring</option>
<option value="bracelet">Bracelet</option>
<option value="necklace">Necklace</option>
<option value="earring">Earring</option>
</select>
</div>

<div class="box">
<label>Metal</label>
<select id="metal">
<option value="yellow">Yellow Gold</option>
<option value="white">White Gold</option>
<option value="rose">Rose Gold</option>
</select>
</div>

<div class="box">
<label>Stone</label>
<select id="stone">
<option value="diamond">Diamond</option>
<option value="solitaire">Solitaire</option>
<option value="none">None</option>
</select>
</div>

<div class="box">
<label>Size</label>
<select id="size">
<option value="2.2">2.2</option>
<option value="2.4">2.4</option>
<option value="2.5" selected>2.5</option>
<option value="2.6">2.6</option>
<option value="2.8">2.8</option>
<option value="3.0">3.0</option>
</select>
</div>

<div class="box">
<label>Thickness</label>
<input id="thickness"
 type="range"
 min="0.16"
 max="0.50"
 step="0.01"
 value="0.28"
 oninput="thicknessValue.innerText=this.value">

<div style="text-align:center;margin-top:5px">
<span id="thicknessValue">0.28</span>
</div>
</div>

<div class="box">
<label>Diamonds</label>
<input id="diamondCount"
 type="range"
 min="0"
 max="48"
 step="1"
 value="24"
 oninput="diamondValue.innerText=this.value">

<div style="text-align:center;margin-top:5px">
<span id="diamondValue">24</span>
</div>
</div>

</div>

<div class="reference">

<label>Reference Photo</label>

<input type="file" id="reference" accept="image/*">

<img id="preview">

</div>

<button onclick="generateCAD()">✨ Generate CAD</button>

<button class="secondary" onclick="resetCAD()">↻ Reset</button>

<button class="secondary" onclick="toggleStones()">💎 Show / Hide Stones</button>

<div class="viewer">

<div class="status" id="status">
V2.4 Starting...
</div>

<div class="error" id="error"></div>

<div id="viewer"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

let scene;
let camera;
let renderer;
let controls;

let jewelleryGroup;
let stoneGroup;

let stonesVisible=true;


/* =========================
   INITIALIZE
========================= */

function init(){

try{

scene=new THREE.Scene();

scene.background=new THREE.Color(0x030303);


/* CAMERA */

camera=new THREE.PerspectiveCamera(
45,
1,
0.1,
1000
);

camera.position.set(0,4.8,8);


/* RENDERER */

renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

let viewer=
document.getElementById("viewer");

renderer.setSize(
viewer.clientWidth,
viewer.clientHeight
);

viewer.appendChild(renderer.domElement);


/* CONTROLS */

controls=new THREE.OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping=true;
controls.dampingFactor=.07;
controls.minDistance=3;
controls.maxDistance=16;


/* LIGHTS */

scene.add(
new THREE.AmbientLight(
0xffffff,
1.6
)
);

let keyLight=
new THREE.DirectionalLight(
0xffffff,
2.5
);

keyLight.position.set(
5,8,6
);

scene.add(keyLight);

let fillLight=
new THREE.DirectionalLight(
0xffffff,
1.5
);

fillLight.position.set(
-6,4,-5
);

scene.add(fillLight);

let topLight=
new THREE.PointLight(
0xffffff,
1.5,
30
);

topLight.position.set(
0,6,2
);

scene.add(topLight);


/* GROUPS */

jewelleryGroup=
new THREE.Group();

stoneGroup=
new THREE.Group();

scene.add(jewelleryGroup);
scene.add(stoneGroup);


/* FIRST MODEL */

generateCAD();

window.addEventListener(
"resize",
onResize
);

animate();

document.getElementById("status")
.innerText="V2.4 Ready";

}catch(e){

showError(e);

}

}


/* =========================
   METAL MATERIAL
========================= */

function getMetal(){

let value=
document.getElementById("metal").value;

if(value==="white"){

return new THREE.MeshStandardMaterial({
color:0xd9dde2,
metalness:.95,
roughness:.16
});

}

if(value==="rose"){

return new THREE.MeshStandardMaterial({
color:0xb76e79,
metalness:.95,
roughness:.18
});

}

return new THREE.MeshStandardMaterial({
color:0xd4af37,
metalness:.96,
roughness:.17
});

}


/* =========================
   DIAMOND MATERIAL
========================= */

function getDiamondMaterial(){

return new THREE.MeshPhysicalMaterial({

color:0xfafafa,

metalness:0.02,

roughness:0.025,

transparent:true,

opacity:.96

});

}


/* =========================
   CLEAR MODEL
========================= */

function clearModel(){

while(
jewelleryGroup.children.length
){

jewelleryGroup.remove(
jewelleryGroup.children[0]
);

}

while(
stoneGroup.children.length
){

stoneGroup.remove(
stoneGroup.children[0]
);

}

}


/* =========================
   GENERATE CAD
========================= */

function generateCAD(){

try{

clearModel();

let type=
document.getElementById("type").value;

if(type==="bangle"){
createBangle();
}

if(type==="ring"){
createRing();
}

if(type==="bracelet"){
createBracelet();
}

if(type==="necklace"){
createNecklace();
}

if(type==="earring"){
createEarring();
}

document.getElementById("status")
.innerText="V2.4 CAD Generated ✓";

}catch(e){

showError(e);

}

}


/* =========================
   PROFESSIONAL BANGLE
========================= */

function createBangle(){

let size=
parseFloat(
document.getElementById("size").value
);

let thickness=
parseFloat(
document.getElementById("thickness").value
);

let count=
parseInt(
document.getElementById("diamondCount").value
);

let radius=
2.65+(size-2.5)*1.15;


/* MAIN BANGLE */

let bangle=
new THREE.Mesh(

new THREE.TorusGeometry(
radius,
thickness,
40,
160
),

getMetal()

);

bangle.rotation.x=
Math.PI/2;

jewelleryGroup.add(bangle);


/* INNER HIGHLIGHT RAIL */

let rail=
new THREE.Mesh(

new THREE.TorusGeometry(
radius,
thickness*.22,
16,
160
),

getMetal()

);

rail.rotation.x=
Math.PI/2;

rail.position.y=
thickness*.72;

jewelleryGroup.add(rail);


/* DIAMOND SETTINGS */

if(
document.getElementById("stone").value!=="none"
&& count>0
){

for(let i=0;i<count;i++){

let angle=
(i/count)*Math.PI*2;

let x=
Math.cos(angle)*radius;

let z=
Math.sin(angle)*radius;

createProfessionalSetting(
x,
0,
z,
angle,
thickness
);

}

}

}


/* =========================
   PROFESSIONAL SETTING
========================= */

function createProfessionalSetting(
x,
y,
z,
angle,
thickness
){

let setting=
new THREE.Group();

let metal=
getMetal();


/* BASE / BEZEL */

let base=
new THREE.Mesh(

new THREE.CylinderGeometry(
.115,
.14,
.055,
24
),

metal

);

base.position.y=
thickness+.035;

setting.add(base);


/* DIAMOND */

let diamondSize=
Math.max(
.13,
Math.min(.21,thickness*.72)
);

let diamond=
new THREE.Mesh(

new THREE.OctahedronGeometry(
diamondSize,
1
),

getDiamondMaterial()

);

diamond.scale.y=1.18;

diamond.position.y=
thickness+.17;

setting.add(diamond);


/* FOUR PRONGS */

for(let i=0;i<4;i++){

let a=
(i*Math.PI/2)+(Math.PI/4);

let px=
Math.cos(a)*diamondSize*.72;

let pz=
Math.sin(a)*diamondSize*.72;

let prong=
new THREE.Mesh(

new THREE.CylinderGeometry(
.018,
.025,
.18,
10
),

metal

);

prong.position.set(
px,
thickness+.105,
pz
);

setting.add(prong);

}


/* SMALL SHOULDER SUPPORTS */

for(let i=0;i<2;i++){

let side=
i===0?-1:1;

let support=
new THREE.Mesh(

new THREE.CylinderGeometry(
.025,
.032,
.13,
10
),

metal

);

support.rotation.z=
side*.45;

support.position.set(
side*.095,
thickness+.075,
0
);

setting.add(support);

}


/* POSITION */

setting.position.set(
x,
y,
z
);

setting.rotation.y=
-angle;

stoneGroup.add(setting);

}


/* =========================
   RING
========================= */

function createRing(){

let thickness=
parseFloat(
document.getElementById("thickness").value
);

let ring=
new THREE.Mesh(

new THREE.TorusGeometry(
1.75,
thickness,
36,
120
),

getMetal()

);

ring.rotation.x=
Math.PI/2;

jewelleryGroup.add(ring);


if(
document.getElementById("stone").value!=="none"
){

let setting=
createRingSetting(
thickness
);

stoneGroup.add(setting);

}

}


/* =========================
   RING SETTING
========================= */

function createRingSetting(thickness){

let group=
new THREE.Group();

let metal=
getMetal();

let base=
new THREE.Mesh(

new THREE.CylinderGeometry(
.28,
.34,
.10,
32
),

metal

);

base.position.y=
thickness+.20;

group.add(base);

let diamond=
new THREE.Mesh(

new THREE.OctahedronGeometry(
.42,
2
),

getDiamondMaterial()

);

diamond.scale.y=1.15;

diamond.position.y=
thickness+.52;

group.add(diamond);


/* 4 PRONGS */

for(let i=0;i<4;i++){

let a=
i*Math.PI/2+Math.PI/4;

let prong=
new THREE.Mesh(

new THREE.CylinderGeometry(
.025,
.035,
.32,
10
),

metal

);

prong.position.set(
Math.cos(a)*.28,
thickness+.40,
Math.sin(a)*.28
);

group.add(prong);

}

return group;

}


/* =========================
   BRACELET
========================= */

function createBracelet(){

let thickness=
parseFloat(
document.getElementById("thickness").value
);

let radius=2.7;

let bracelet=
new THREE.Mesh(

new THREE.TorusGeometry(
radius,
thickness,
36,
140
),

getMetal()

);

bracelet.rotation.x=
Math.PI/2;

jewelleryGroup.add(bracelet);

let count=
parseInt(
document.getElementById("diamondCount").value
);

if(
document.getElementById("stone").value!=="none"
){

for(let i=0;i<count;i++){

let angle=
(i/count)*Math.PI*2;

createProfessionalSetting(
Math.cos(angle)*radius,
0,
Math.sin(angle)*radius,
angle,
thickness
);

}

}

}


/* =========================
   NECKLACE
========================= */

function createNecklace(){

let curve=
new THREE.EllipseCurve(
0,0,
3.2,2.25,
0,Math.PI*2,
false,
0
);

let points=
curve.getPoints(120);

let vectors=[];

for(let p of points){

vectors.push(
new THREE.Vector3(
p.x,
0,
p.y
)
);

}

let geometry=
new THREE.BufferGeometry()
.setFromPoints(vectors);

let line=
new THREE.LineLoop(

geometry,

new THREE.LineBasicMaterial({
color:getMetal().color
})

);

jewelleryGroup.add(line);


/* PENDANT */

if(
document.getElementById("stone").value!=="none"
){

let pendant=
new THREE.Mesh(

new THREE.OctahedronGeometry(
.55,
2
),

getDiamondMaterial()

);

pendant.position.set(
0,
0,
2.25
);

stoneGroup.add(pendant);

}

}


/* =========================
   EARRING
========================= */

function createEarring(){

let thickness=
parseFloat(
document.getElementById("thickness").value
);

let hoop=
new THREE.Mesh(

new THREE.TorusGeometry(
1.4,
thickness,
32,
100
),

getMetal()

);

hoop.rotation.x=
Math.PI/2;

jewelleryGroup.add(hoop);


if(
document.getElementById("stone").value!=="none"
){

let diamond=
new THREE.Mesh(

new THREE.OctahedronGeometry(
.38,
2
),

getDiamondMaterial()

);

diamond.position.y=
thickness+.45;

stoneGroup.add(diamond);

}

}


/* =========================
   SHOW / HIDE
========================= */

function toggleStones(){

stonesVisible=
!stonesVisible;

stoneGroup.visible=
stonesVisible;

document.getElementById("status")
.innerText=
stonesVisible
?
"Stones Visible"
:
"Stones Hidden";

}


/* =========================
   RESET
========================= */

function resetCAD(){

document.getElementById("type").value="bangle";

document.getElementById("metal").value="yellow";

document.getElementById("stone").value="diamond";

document.getElementById("size").value="2.5";

document.getElementById("thickness").value="0.28";

document.getElementById("thicknessValue")
.innerText="0.28";

document.getElementById("diamondCount")
.value="24";

document.getElementById("diamondValue")
.innerText="24";

stonesVisible=true;

stoneGroup.visible=true;

generateCAD();

}


/* =========================
   REFERENCE PHOTO
========================= */

document.getElementById("reference")
.addEventListener(
"change",
function(){

let file=this.files[0];

if(!file)return;

let url=
URL.createObjectURL(file);

let img=
document.getElementById("preview");

img.src=url;

img.style.display="block";

}
);


/* =========================
   RESIZE
========================= */

function onResize(){

let viewer=
document.getElementById("viewer");

let w=
viewer.clientWidth;

let h=
viewer.clientHeight;

camera.aspect=
w/h;

camera.updateProjectionMatrix();

renderer.setSize(
w,
h
);

}


/* =========================
   ANIMATION
========================= */

function animate(){

requestAnimationFrame(
animate
);

if(controls){
controls.update();
}

if(renderer && scene && camera){

renderer.render(
scene,
camera
);

}

}


/* =========================
   ERROR
========================= */

function showError(e){

let error=
document.getElementById("error");

error.style.display="block";

error.innerText=
"CAD Error: "+e.message;

document.getElementById("status")
.innerText="Error";

console.error(e);

}


/* START */

init();

</script>

</body>
  </html>
