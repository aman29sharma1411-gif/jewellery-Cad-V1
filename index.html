<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jewellery CAD AI V2.2</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#101010;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  height:58px;
  background:#1c1c1c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:bold;
}

#controls{
  background:#181818;
  padding:10px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  align-items:end;
}

.control{
  display:flex;
  flex-direction:column;
  gap:4px;
  font-size:12px;
}

select,
input,
button{
  background:#292929;
  color:white;
  border:1px solid #555;
  border-radius:7px;
  padding:8px;
}

input{
  width:85px;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

#viewer{
  width:100%;
  height:calc(100vh - 155px);
  min-height:430px;
  position:relative;
  overflow:hidden;
}

#status{
  position:absolute;
  z-index:5;
  top:10px;
  left:10px;
  background:rgba(0,0,0,.7);
  padding:7px 10px;
  border-radius:7px;
  font-size:12px;
}

#error{
  display:none;
  position:absolute;
  z-index:20;
  left:10px;
  right:10px;
  bottom:10px;
  background:#650000;
  padding:10px;
  border-radius:7px;
  font-size:12px;
}

#reference{
  position:absolute;
  z-index:6;
  right:10px;
  top:10px;
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #777;
  display:none;
}

#file{
  width:170px;
}
</style>
</head>

<body>

<header>
💎 Jewellery CAD AI V2.2
</header>

<div id="controls">

  <div class="control">
    <label>Jewellery</label>
    <select id="type">
      <option value="bangle">Bangle</option>
      <option value="ring">Ring</option>
      <option value="bracelet">Bracelet</option>
      <option value="necklace">Necklace</option>
      <option value="earring">Earring</option>
    </select>
  </div>

  <div class="control">
    <label>Metal</label>
    <select id="metal">
      <option value="yellow">Yellow Gold</option>
      <option value="white">White Gold</option>
      <option value="rose">Rose Gold</option>
    </select>
  </div>

  <div class="control">
    <label>Stone</label>
    <select id="stone">
      <option value="diamond">Diamond</option>
      <option value="none">No Stone</option>
    </select>
  </div>

  <div class="control">
    <label>Size</label>
    <input id="size" type="number" value="2.5" min="1.5" max="4" step="0.1">
  </div>

  <div class="control">
    <label>Thickness</label>
    <input id="thickness" type="number" value="0.28" min="0.10" max="0.60" step="0.02">
  </div>

  <div class="control">
    <label>Diamonds</label>
    <input id="diamondCount" type="number" value="24" min="4" max="80" step="1">
  </div>

  <div class="control">
    <label>Reference</label>
    <input id="file" type="file" accept="image/*">
  </div>

  <button onclick="generate()">Generate CAD</button>

  <button onclick="resetView()">Reset</button>

  <button onclick="toggleStones()">Stones</button>

</div>

<div id="viewer">

  <div id="status">
    V2.2 Loading...
  </div>

  <img id="reference">

  <div id="error"></div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import {OrbitControls} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


let scene;
let camera;
let renderer;
let controls;

let jewellery;

let stonesVisible = true;


/* ---------------- INITIALIZE ---------------- */

function init(){

  const viewer =
    document.getElementById("viewer");

  scene =
    new THREE.Scene();

  scene.background =
    new THREE.Color(0x101010);


  camera =
    new THREE.PerspectiveCamera(
      45,
      viewer.clientWidth /
      viewer.clientHeight,
      0.1,
      1000
    );

  camera.position.set(
    0,
    2.5,
    7
  );


  renderer =
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
  );

  renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
  );

  viewer.appendChild(
    renderer.domElement
  );


  controls =
    new OrbitControls(
      camera,
      renderer.domElement
    );

  controls.enableDamping = true;

  controls.dampingFactor = 0.06;

  controls.minDistance = 3;

  controls.maxDistance = 15;


  /* LIGHTS */

  const ambient =
    new THREE.AmbientLight(
      0xffffff,
      2
    );

  scene.add(ambient);


  const light1 =
    new THREE.DirectionalLight(
      0xffffff,
      4
    );

  light1.position.set(
    5,
    6,
    5
  );

  scene.add(light1);


  const light2 =
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  light2.position.set(
    -5,
    3,
    -4
  );

  scene.add(light2);


  const light3 =
    new THREE.PointLight(
      0xffffff,
      2
    );

  light3.position.set(
    0,
    -3,
    5
  );

  scene.add(light3);


  generate();


  document.getElementById(
    "status"
  ).innerText =
    "✅ V2.2 3D ACTIVE";


  animate();
}


/* ---------------- MATERIAL ---------------- */

function metalMaterial(){

  const metal =
    document.getElementById(
      "metal"
    ).value;

  let color =
    0xd4af37;

  if(metal === "white"){
    color =
      0xd9e1e8;
  }

  if(metal === "rose"){
    color =
      0xb76e79;
  }

  return new THREE.MeshStandardMaterial({

    color:color,

    metalness:0.9,

    roughness:0.18

  });
}


/* ---------------- DIAMOND ---------------- */

function diamondMaterial(){

  return new THREE.MeshPhysicalMaterial({

    color:0xffffff,

    metalness:0.05,

    roughness:0.02,

    transmission:0.25,

    transparent:true,

    opacity:0.95

  });

}


/* ---------------- GENERATE ---------------- */

window.generate = function(){

  if(!scene) return;


  if(jewellery){

    scene.remove(
      jewellery
    );

  }


  jewellery =
    new THREE.Group();


  const type =
    document.getElementById(
      "type"
    ).value;


  if(type === "bangle"){

    jewellery =
      createBangle();

  }

  else if(type === "ring"){

    jewellery =
      createRing();

  }

  else if(type === "bracelet"){

    jewellery =
      createBracelet();

  }

  else if(type === "necklace"){

    jewellery =
      createNecklace();

  }

  else if(type === "earring"){

    jewellery =
      createEarring();

  }


  scene.add(
    jewellery
  );


  resetView();

};


/* ---------------- BANGLE ---------------- */

function createBangle(){

  const group =
    new THREE.Group();


  const radius =
    parseFloat(
      document.getElementById(
        "size"
      ).value
    );


  const thickness =
    parseFloat(
      document.getElementById(
        "thickness"
      ).value
    );


  const count =
    parseInt(
      document.getElementById(
        "diamondCount"
      ).value
    );


  const gold =
    metalMaterial();


  /* MAIN BANGLE */

  const torus =
    new THREE.Mesh(

      new THREE.TorusGeometry(
        radius,
        thickness,
        32,
        128
      ),

      gold

    );


  group.add(
    torus
  );


  /* INNER SUPPORT */

  const inner =
    new THREE.Mesh(

      new THREE.TorusGeometry(
        radius,
        thickness * 0.55,
        24,
        128
      ),

      gold

    );


  inner.scale.set(
    1,
    0.97,
    1
  );


  group.add(
    inner
  );


  /* DIAMONDS */

  addDiamondSettings(
    group,
    radius,
    thickness,
    count
  );


  return group;

}


/* ---------------- DIAMOND SETTINGS ---------------- */

function addDiamondSettings(
  group,
  radius,
  thickness,
  count
){

  const stoneType =
    document.getElementById(
      "stone"
    ).value;


  if(stoneType === "none"){
    return;
  }


  const diamondMat =
    diamondMaterial();


  const gold =
    metalMaterial();


  for(
    let i=0;
    i<count;
    i++
  ){

    const angle =
      i / count *
      Math.PI * 2;


    const x =
      Math.cos(angle) *
      radius;


    const z =
      Math.sin(angle) *
      radius;


    /* DIAMOND */

    const diamond =
      new THREE.Mesh(

        new THREE.OctahedronGeometry(
          thickness * 0.48,
          1
        ),

        diamondMat

      );


    diamond.position.set(
      x,
      thickness * 0.85,
      z
    );


    diamond.scale.y =
      0.7;


    group.add(
      diamond
    );


    /* FOUR PRONGS */

    const prongRadius =
      thickness * 0.10;


    const prongHeight =
      thickness * 0.55;


    const offsets = [

      [0.16,0],

      [-0.16,0],

      [0,0.16],

      [0,-0.16]

    ];


    for(
      const offset of offsets
    ){

      const prong =
        new THREE.Mesh(

          new THREE.CylinderGeometry(
            prongRadius,
            prongRadius * 1.2,
            prongHeight,
            10
          ),

          gold

        );


      const localX =
        Math.cos(angle) *
        (radius + offset[0]);


      const localZ =
        Math.sin(angle) *
        (radius + offset[0]);


      prong.position.set(
        localX,
        thickness * 0.72,
        localZ
      );


      prong.scale.x =
        1;


      group.add(
        prong
      );

    }

  }

}


/* ---------------- RING ---------------- */

function createRing(){

  const group =
    new THREE.Group();


  const gold =
    metalMaterial();


  const ring =
    new THREE.Mesh(

      new THREE.TorusGeometry(
        1.45,
        0.25,
        32,
        100
      ),

      gold

    );


  group.add(
    ring
  );


  const diamond =
    new THREE.Mesh(

      new THREE.OctahedronGeometry(
        0.5,
        2
      ),

      diamondMaterial()

    );


  diamond.position.y =
    1.35;


  group.add(
    diamond
  );


  addProngs(
    group,
    0,
    1.35,
    0.5
  );


  return group;

}


/* ---------------- PRONGS ---------------- */

function addProngs(
  group,
  x,
  y,
  size
){

  const gold =
    metalMaterial();


  const positions = [

    [x-size*0.55,y,0],

    [x+size*0.55,y,0],

    [x,y,0.18],

    [x,y,-0.18]

  ];


  positions.forEach(
    p => {

      const prong =
        new THREE.Mesh(

          new THREE.CylinderGeometry(
            0.06,
            0.07,
            0.35,
            10
          ),

          gold

        );


      prong.position.set(
        p[0],
        p[1],
        p[2]
      );


      group.add(
        prong
      );

    }
  );

}


/* ---------------- BRACELET ---------------- */

function createBracelet(){

  const group =
    new THREE.Group();


  const gold =
    metalMaterial();


  const radius = 1.7;


  for(
    let i=0;
    i<6;
    i++
  ){

    const torus =
      new THREE.Mesh(

        new THREE.TorusGeometry(
          radius,
          0.18,
          24,
          80
        ),

        gold

      );


    torus.rotation.x =
      i * 0.08;


    group.add(
      torus
    );

  }


  addDiamondSettings(
    group,
    radius,
    0.22,
    18
  );


  return group;

}


/* ---------------- NECKLACE ---------------- */

function createNecklace(){

  const group =
    new THREE.Group();


  const gold =
    metalMaterial();


  const curve =
    new THREE.EllipseCurve(
      0,
      0,
      2.8,
      2.0,
      Math.PI,
      Math.PI * 2,
      false,
      0
    );


  const points =
    curve.getPoints(
      100
    );


  const geometry =
    new THREE.BufferGeometry()
      .setFromPoints(

        points.map(
          p =>
            new THREE.Vector3(
              p.x,
              -p.y,
              0
            )
        )

      );


  const line =
    new THREE.Line(

      geometry,

      new THREE.LineBasicMaterial({
        color:0xd4af37
      })

    );


  group.add(
    line
  );


  /* PENDANT */

  const pendant =
    new THREE.Mesh(

      new THREE.OctahedronGeometry(
        0.55,
        2
      ),

      diamondMaterial()

    );


  pendant.position.y =
    -1.9;


  group.add(
    pendant
  );


  return group;

}


/* ---------------- EARRING ---------------- */

function createEarring(){

  const group =
    new THREE.Group();


  const gold =
    metalMaterial();


  const hoop =
    new THREE.Mesh(

      new THREE.TorusGeometry(
        1.3,
        0.18,
        24,
        90
      ),

      gold

    );


  group.add(
    hoop
  );


  const diamond =
    new THREE.Mesh(

      new THREE.OctahedronGeometry(
        0.45,
        2
      ),

      diamondMaterial()

    );


  diamond.position.y =
    1.3;


  group.add(
    diamond
  );


  addProngs(
    group,
    0,
    1.3,
    0.45
  );


  return group;

}


/* ---------------- RESET ---------------- */

window.resetView =
function(){

  if(!jewellery)
    return;


  jewellery.rotation.set(
    0,
    0,
    0
  );


  camera.position.set(
    0,
    2.5,
    7
  );


  controls.target.set(
    0,
    0,
    0
  );


  controls.update();

};


/* ---------------- STONES ---------------- */

window.toggleStones =
function(){

  stonesVisible =
    !stonesVisible;


  if(!jewellery)
    return;


  jewellery.traverse(
    child => {

      if(
        child.isMesh &&
        child.material
      ){

        const material =
          child.material;


        if(
          material.transmission !== undefined
        ){

          child.visible =
            stonesVisible;

        }

      }

    }
  );

};


/* ---------------- REFERENCE PHOTO ---------------- */

document.getElementById(
  "file"
).addEventListener(
  "change",
  function(){

    const file =
      this.files[0];


    if(!file)
      return;


    const url =
      URL.createObjectURL(
        file
      );


    const image =
      document.getElementById(
        "reference"
      );


    image.src =
      url;


    image.style.display =
      "block";

  }
);


/* ---------------- RESIZE ---------------- */

window.addEventListener(
  "resize",
  function(){

    if(!renderer)
      return;


    const viewer =
      document.getElementById(
        "viewer"
      );


    camera.aspect =
      viewer.clientWidth /
      viewer.clientHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      viewer.clientWidth,
      viewer.clientHeight
    );

  }
);


/* ---------------- ANIMATION ---------------- */

function animate(){

  requestAnimationFrame(
    animate
  );


  if(controls)
    controls.update();


  renderer.render(
    scene,
    camera
  );

}


/* ---------------- START ---------------- */

try{

  init();

}

catch(error){

  console.error(
    error
  );


  const box =
    document.getElementById(
      "error"
    );


  box.style.display =
    "block";


  box.innerText =
    "❌ 3D Error: " +
    error.message;


  document.getElementById(
    "status"
  ).innerText =
    "3D Error";

}

</script>

</body>
</html>
