<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jewellery CAD AI V2.8</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:14px;
  text-align:center;
  background:#111;
  border-bottom:1px solid #333;
  font-size:20px;
  font-weight:bold;
}

.app{
  display:flex;
  flex-direction:column;
  min-height:calc(100vh - 55px);
}

.controls{
  padding:12px;
  background:#111;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.control{
  background:#181818;
  padding:10px;
  border-radius:10px;
  border:1px solid #2d2d2d;
}

label{
  display:block;
  font-size:12px;
  color:#aaa;
  margin-bottom:6px;
}

select,
input{
  width:100%;
  padding:9px;
  border-radius:7px;
  border:1px solid #444;
  background:#0c0c0c;
  color:white;
}

input[type="range"]{
  padding:0;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#333;
  color:white;
  font-weight:bold;
  margin-top:5px;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:#b8860b;
}

.green{
  background:#176b38;
}

.viewer{
  position:relative;
  height:58vh;
  min-height:400px;
  background:#050505;
  overflow:hidden;
}

#canvas{
  width:100%;
  height:100%;
}

.reference{
  padding:12px;
  background:#111;
}

.reference img{
  max-width:180px;
  max-height:130px;
  display:none;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #444;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:5px;
}

.small-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.status{
  position:absolute;
  top:10px;
  left:10px;
  z-index:5;
  background:rgba(0,0,0,.65);
  padding:7px 10px;
  border-radius:7px;
  font-size:12px;
  color:#aaa;
}

@media(max-width:600px){
  .controls{
    grid-template-columns:1fr 1fr;
  }

  .viewer{
    height:55vh;
    min-height:350px;
  }
}
</style>
</head>

<body>

<header>
💎 Jewellery CAD AI V2.8
</header>

<div class="app">

<div class="controls">

<div class="control">
<label>Jewellery Type</label>
<select id="jewelleryType">
<option value="bangle">Bangle</option>
<option value="ring">Ring</option>
<option value="bracelet">Bracelet</option>
<option value="necklace">Necklace</option>
<option value="earring">Earring</option>
</select>
</div>

<div class="control">
<label>Metal</label>
<select id="metal">
<option value="yellow">Yellow Gold</option>
<option value="white">White Gold</option>
<option value="rose">Rose Gold</option>
</select>
</div>

<div class="control">
<label>Stone</label>
<select id="stone">
<option value="diamond">Diamond</option>
<option value="solitaire">Solitaire</option>
<option value="none">None</option>
</select>
</div>

<div class="control">
<label>Design Pattern</label>
<select id="pattern">
<option value="classic">Classic</option>
<option value="pave">Pavé</option>
<option value="floral">Floral</option>
<option value="leaf">Leaf</option>
<option value="oval">Oval</option>
<option value="geometric">Geometric</option>
</select>
</div>

<div class="control">
<label>Size</label>
<input id="size" type="range" min="45" max="75" value="58">
<div id="sizeValue">58 mm</div>
</div>

<div class="control">
<label>Thickness</label>
<input id="thickness" type="range" min="2" max="8" step="0.2" value="4">
<div id="thicknessValue">4.0 mm</div>
</div>

<div class="control">
<label>Diamond Count</label>
<input id="diamondCount" type="range" min="4" max="48" value="20">
<div id="diamondValue">20</div>
</div>

<div class="control">
<label>Diamond Size</label>
<select id="diamondSize">
<option value="small">Small</option>
<option value="medium" selected>Medium</option>
<option value="large">Large</option>
</select>
</div>

<div class="control">
<label>Reference Photo</label>
<input id="reference" type="file" accept="image/*">
</div>

<div class="control">
<label>Actions</label>

<div class="small-buttons">
<button class="primary" id="generate">Generate CAD</button>
<button id="reset">Reset</button>
</div>

<div class="small-buttons">
<button id="stones">Hide Stones</button>
<button id="home">3D View</button>
</div>

</div>

<div class="control">
<label>Camera</label>

<div class="buttons">
<button id="front">Front</button>
<button id="top">Top</button>
<button id="threeD">3D</button>
</div>

</div>

</div>

<div class="reference">
<label>Reference Preview</label>
<img id="preview">
</div>

<div class="viewer">

<div class="status" id="status">
V2.8 • Live 3D CAD
</div>

<div id="canvas"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

let scene;
let camera;
let renderer;
let controls;

let jewelleryGroup;
let stonesGroup;

let showStones=true;

let currentMetal;
let currentStone;

const canvas=document.getElementById("canvas");

const metalColors={
  yellow:0xd4af37,
  white:0xd8d8d8,
  rose:0xe8a09a
};

function init(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x050505);

  camera=new THREE.PerspectiveCamera(
    45,
    canvas.clientWidth/canvas.clientHeight,
    0.1,
    1000
  );

  camera.position.set(0,35,70);

  renderer=new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setPixelRatio(window.devicePixelRatio);

  renderer.setSize(
    canvas.clientWidth,
    canvas.clientHeight
  );

  canvas.appendChild(renderer.domElement);

  controls=new THREE.OrbitControls(
    camera,
    renderer.domElement
  );

  controls.enableDamping=true;

  controls.dampingFactor=.08;

  const ambient=new THREE.AmbientLight(
    0xffffff,
    1.5
  );

  scene.add(ambient);

  const light1=new THREE.DirectionalLight(
    0xffffff,
    2
  );

  light1.position.set(40,60,50);

  scene.add(light1);

  const light2=new THREE.DirectionalLight(
    0xffffff,
    1.5
  );

  light2.position.set(-40,20,-30);

  scene.add(light2);

  jewelleryGroup=new THREE.Group();

  stonesGroup=new THREE.Group();

  jewelleryGroup.add(stonesGroup);

  scene.add(jewelleryGroup);

  createJewellery();

  animate();
}

function getMetal(){

  return metalColors[
    document.getElementById("metal").value
  ];

}

function createMaterial(){

  return new THREE.MeshStandardMaterial({

    color:getMetal(),

    metalness:.85,

    roughness:.2

  });

}

function createDiamond(size){

  let s=0.7;

  if(size==="small") s=.45;

  if(size==="large") s=.9;

  const geometry=
    new THREE.OctahedronGeometry(s,1);

  const material=
    new THREE.MeshPhysicalMaterial({

      color:0xffffff,

      metalness:0,

      roughness:.02,

      transmission:.15,

      transparent:true,

      opacity:.95

    });

  return new THREE.Mesh(
    geometry,
    material
  );
}

function addProngs(group,size){

  const prongMaterial=createMaterial();

  const positions=[

    [size,0,0],
    [-size,0,0],
    [0,size,0],
    [0,-size,0]

  ];

  positions.forEach(p=>{

    const geo=
      new THREE.CylinderGeometry(
        .12,
        .16,
        .7,
        8
      );

    const mesh=
      new THREE.Mesh(
        geo,
        prongMaterial
      );

    mesh.position.set(
      p[0],
      p[1],
      p[2]
    );

    group.add(mesh);

  });

}

function addDiamondSetting(
  x,
  y,
  z,
  rotation=0
){

  const group=new THREE.Group();

  group.position.set(x,y,z);

  group.rotation.y=rotation;

  const metal=createMaterial();

  const baseGeo=
    new THREE.CylinderGeometry(
      .72,
      .85,
      .22,
      24
    );

  const base=
    new THREE.Mesh(
      baseGeo,
      metal
    );

  group.add(base);

  const diamond=
    createDiamond(
      document.getElementById(
        "diamondSize"
      ).value
    );

  diamond.position.y=.55;

  group.add(diamond);

  addProngs(group,.5);

  stonesGroup.add(group);

}

function createBangle(){

  const group=new THREE.Group();

  const size=
    Number(
      document.getElementById("size").value
    );

  const thickness=
    Number(
      document.getElementById("thickness").value
    );

  const count=
    Number(
      document.getElementById("diamondCount").value
    );

  const pattern=
    document.getElementById("pattern").value;

  const radius=size/2;

  const material=createMaterial();

  const bodyGeo=
    new THREE.TorusGeometry(
      radius,
      thickness/2,
      32,
      160
    );

  const body=
    new THREE.Mesh(
      bodyGeo,
      material
    );

  body.rotation.x=Math.PI/2;

  group.add(body);

  if(
    pattern==="classic" ||
    pattern==="pave" ||
    pattern==="floral" ||
    pattern==="leaf" ||
    pattern==="oval" ||
    pattern==="geometric"
  ){

    createPattern(
      group,
      radius,
      thickness,
      count,
      pattern
    );

  }

  return group;

}

function createPattern(
  group,
  radius,
  thickness,
  count,
  pattern
){

  const actualCount=
    Math.max(
      4,
      Math.min(count,48)
    );

  for(
    let i=0;
    i<actualCount;
    i++
  ){

    const angle=
      (i/actualCount)*Math.PI*2;

    const x=
      Math.cos(angle)*radius;

    const z=
      Math.sin(angle)*radius;

    if(pattern==="classic"){

      if(i%2===0){

        addDiamondSetting(
          x,
          thickness*.5,
          z,
          angle
        );

      }

    }

    else if(pattern==="pave"){

      addDiamondSetting(
        x,
        thickness*.55,
        z,
        angle
      );

    }

    else if(pattern==="floral"){

      createFlower(
        x,
        thickness*.6,
        z,
        angle,
        radius
      );

    }

    else if(pattern==="leaf"){

      createLeaf(
        x,
        thickness*.6,
        z,
        angle
      );

    }

    else if(pattern==="oval"){

      createOval(
        x,
        thickness*.55,
        z,
        angle
      );

    }

    else if(pattern==="geometric"){

      createGeometric(
        x,
        thickness*.55,
        z,
        angle,
        i
      );

    }

  }

}

function createFlower(
  x,
  y,
  z,
  angle,
  radius
){

  const flower=
    new THREE.Group();

  flower.position.set(
    x,y,z
  );

  flower.rotation.y=-angle;

  const metal=createMaterial();

  for(let p=0;p<4;p++){

    const a=
      (p/4)*Math.PI*2;

    const petalGeo=
      new THREE.SphereGeometry(
        .7,
        16,
        10
      );

    const petal=
      new THREE.Mesh(
        petalGeo,
        metal
      );

    petal.scale.set(
      .65,
      .25,
      1
    );

    petal.position.set(
      Math.cos(a)*.65,
      0,
      Math.sin(a)*.65
    );

    flower.add(petal);

  }

  const center=
    createDiamond(
      document.getElementById(
        "diamondSize"
      ).value
    );

  center.scale.multiplyScalar(.65);

  center.position.y=.35;

  flower.add(center);

  addProngs(
    flower,
    .32
  );

  stonesGroup.add(flower);

}

function createLeaf(
  x,
  y,
  z,
  angle
){

  const group=
    new THREE.Group();

  group.position.set(
    x,y,z
  );

  group.rotation.y=-angle;

  const metal=createMaterial();

  const leafGeo=
    new THREE.SphereGeometry(
      1,
      20,
      12
    );

  const leaf=
    new THREE.Mesh(
      leafGeo,
      metal
    );

  leaf.scale.set(
    .45,
    .18,
    1.15
  );

  group.add(leaf);

  const diamond=
    createDiamond(
      document.getElementById(
        "diamondSize"
      ).value
    );

  diamond.scale.multiplyScalar(.55);

  diamond.position.y=.35;

  group.add(diamond);

  stonesGroup.add(group);

}

function createOval(
  x,
  y,
  z,
  angle
){

  const group=
    new THREE.Group();

  group.position.set(
    x,y,z
  );

  group.rotation.y=-angle;

  const metal=createMaterial();

  const geo=
    new THREE.TorusGeometry(
      .9,
      .18,
      12,
      32
    );

  const oval=
    new THREE.Mesh(
      geo,
      metal
    );

  oval.scale.set(
    .65,
    1,
    1.25
  );

  group.add(oval);

  const diamond=
    createDiamond(
      document.getElementById(
        "diamondSize"
      ).value
    );

  diamond.scale.multiplyScalar(.6);

  diamond.position.y=.35;

  group.add(diamond);

  stonesGroup.add(group);

}

function createGeometric(
  x,
  y,
  z,
  angle,
  index
){

  const group=
    new THREE.Group();

  group.position.set(
    x,y,z
  );

  group.rotation.y=-angle;

  const metal=createMaterial();

  const geo=
    new THREE.BoxGeometry(
      1.1,
      .35,
      .55
    );

  const bar=
    new THREE.Mesh(
      geo,
      metal
    );

  bar.rotation.y=
    index%2===0 ? .5 : -.5;

  group.add(bar);

  if(index%2===0){

    const diamond=
      createDiamond(
        document.getElementById(
          "diamondSize"
        ).value
      );

    diamond.scale.multiplyScalar(.55);

    diamond.position.y=.4;

    group.add(diamond);

  }

  stonesGroup.add(group);

}

function createRing(){

  const group=new THREE.Group();

  const thickness=
    Number(
      document.getElementById("thickness").value
    );

  const material=createMaterial();

  const geo=
    new THREE.TorusGeometry(
      20,
      thickness/2,
      32,
      100
    );

  const ring=
    new THREE.Mesh(
      geo,
      material
    );

  ring.rotation.x=Math.PI/2;

  group.add(ring);

  for(let i=0;i<12;i++){

    const a=
      i/12*Math.PI*2;

    addDiamondSetting(
      Math.cos(a)*20,
      thickness*.6,
      Math.sin(a)*20,
      a
    );

  }

  return group;

}

function createBracelet(){

  const group=
    createBangle();

  group.scale.set(
    1.18,
    1,
    1
  );

  return group;

}

function createNecklace(){

  const group=new THREE.Group();

  const material=createMaterial();

  const geo=
    new THREE.TorusGeometry(
      28,
      1.8,
      24,
      140,
      Math.PI*1.6
    );

  const mesh=
    new THREE.Mesh(
      geo,
      material
    );

  mesh.rotation.x=Math.PI/2;

  group.add(mesh);

  return group;

}

function createEarring(){

  const group=new THREE.Group();

  const material=createMaterial();

  const geo=
    new THREE.TorusGeometry(
      14,
      2,
      24,
      80
    );

  const mesh=
    new THREE.Mesh(
      geo,
      material
    );

  mesh.rotation.x=Math.PI/2;

  group.add(mesh);

  addDiamondSetting(
    0,
    2.5,
    14,
    0
  );

  return group;

}

function createJewellery(){

  while(
    jewelleryGroup.children.length
  ){

    jewelleryGroup.remove(
      jewelleryGroup.children[0]
    );

  }

  stonesGroup=
    new THREE.Group();

  jewelleryGroup.add(
    stonesGroup
  );

  const type=
    document.getElementById(
      "jewelleryType"
    ).value;

  if(type==="bangle"){

    jewelleryGroup.add(
      createBangle()
    );

  }

  else if(type==="ring"){

    jewelleryGroup.add(
      createRing()
    );

  }

  else if(type==="bracelet"){

    jewelleryGroup.add(
      createBracelet()
    );

  }

  else if(type==="necklace"){

    jewelleryGroup.add(
      createNecklace()
    );

  }

  else if(type==="earring"){

    jewelleryGroup.add(
      createEarring()
    );

  }

  stonesGroup.visible=
    showStones;

  controls.target.set(
    0,0,0
  );

}

function updateValues(){

  document.getElementById(
    "sizeValue"
  ).innerText=
    document.getElementById(
      "size"
    ).value+" mm";

  document.getElementById(
    "thicknessValue"
  ).innerText=
    Number(
      document.getElementById(
        "thickness"
      ).value
    ).toFixed(1)+" mm";

  document.getElementById(
    "diamondValue"
  ).innerText=
    document.getElementById(
      "diamondCount"
    ).value;

}

function update(){

  updateValues();

  createJewellery();

}

document.querySelectorAll(
  "select,input[type=range]"
).forEach(el=>{

  el.addEventListener(
    "input",
    update
  );

  el.addEventListener(
    "change",
    update
  );

});

document.getElementById(
  "generate"
).onclick=function(){

  update();

  document.getElementById(
    "status"
  ).innerText=
    "V2.8 • CAD Generated";

};

document.getElementById(
  "stones"
).onclick=function(){

  showStones=!showStones;

  stonesGroup.visible=
    showStones;

  this.innerText=
    showStones
    ? "Hide Stones"
    : "Show Stones";

};

document.getElementById(
  "reset"
).onclick=function(){

  document.getElementById(
    "size"
  ).value=58;

  document.getElementById(
    "thickness"
  ).value=4;

  document.getElementById(
    "diamondCount"
  ).value=20;

  document.getElementById(
    "diamondSize"
  ).value="medium";

  document.getElementById(
    "metal"
  ).value="yellow";

  document.getElementById(
    "pattern"
  ).value="classic";

  document.getElementById(
    "jewelleryType"
  ).value="bangle";

  showStones=true;

  document.getElementById(
    "stones"
  ).innerText="Hide Stones";

  update();

  camera.position.set(
    0,35,70
  );

  controls.target.set(
    0,0,0
  );

};

document.getElementById(
  "front"
).onclick=function(){

  camera.position.set(
    0,0,90
  );

  controls.target.set(
    0,0,0
  );

};

document.getElementById(
  "top"
).onclick=function(){

  camera.position.set(
    0,90,0
  );

  controls.target.set(
    0,0,0
  );

};

document.getElementById(
  "threeD"
).onclick=function(){

  camera.position.set(
    45,35,55
  );

  controls.target.set(
    0,0,0
  );

};

document.getElementById(
  "home"
).onclick=function(){

  camera.position.set(
    45,35,55
  );

  controls.target.set(
    0,0,0
  );

};

document.getElementById(
  "reference"
).addEventListener(
  "change",
  function(){

    const file=this.files[0];

    if(!file)return;

    const reader=
      new FileReader();

    reader.onload=function(e){

      const img=
        document.getElementById(
          "preview"
        );

      img.src=e.target.result;

      img.style.display="block";

    };

    reader.readAsDataURL(file);

  }
);

window.addEventListener(
  "resize",
  function(){

    camera.aspect=
      canvas.clientWidth/
      canvas.clientHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      canvas.clientWidth,
      canvas.clientHeight
    );

  }
);

function animate(){

  requestAnimationFrame(
    animate
  );

  controls.update();

  jewelleryGroup.rotation.y+=0.0015;

  renderer.render(
    scene,
    camera
  );

}

init();

</script>

</body>
</html>
