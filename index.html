<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jewellery CAD AI V2</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  overflow:hidden;
  background:#101217;
  color:white;
  font-family:Arial,sans-serif
}

header{
  height:60px;
  background:#191c24;
  border-bottom:1px solid #333;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  position:relative;
  z-index:10
}

header h2{
  margin:0;
  font-size:19px
}

header span{
  color:#aaa;
  font-size:12px
}

#viewer{
  position:absolute;
  left:0;
  top:60px;
  width:100vw;
  height:calc(100vh - 60px)
}

.panel{
  position:fixed;
  z-index:20;
  left:8px;
  top:68px;
  width:225px;
  max-height:calc(100vh - 76px);
  overflow-y:auto;
  padding:12px;
  background:rgba(25,28,36,.97);
  border:1px solid #444;
  border-radius:13px
}

.panel h3{
  margin:0 0 10px
}

label{
  display:block;
  margin-top:10px;
  font-size:12px;
  color:#bbb
}

select,input[type=file]{
  width:100%;
  margin-top:5px;
  padding:8px;
  background:#20242e;
  color:white;
  border:1px solid #555;
  border-radius:7px
}

input[type=range]{
  width:100%
}

.value{
  float:right;
  color:white
}

button{
  width:100%;
  margin-top:9px;
  padding:9px;
  border:0;
  border-radius:8px;
  background:#454b59;
  color:white;
  font-weight:bold
}

.generate{
  background:#a0781b
}

#preview{
  display:none;
  width:100%;
  height:120px;
  object-fit:contain;
  margin-top:6px;
  border:1px solid #555;
  border-radius:7px;
  background:#08090c
}

.status{
  margin-top:9px;
  padding:8px;
  background:#20242e;
  border-radius:7px;
  color:#aaa;
  font-size:11px
}

@media(max-width:600px){
  .panel{
    width:205px;
    padding:10px
  }

  header h2{
    font-size:15px
  }

  header span{
    display:none
  }
}
</style>
</head>

<body>

<header>
  <h2>💎 Jewellery CAD AI V2</h2>
  <span>3D Jewellery Designer</span>
</header>

<div class="panel">

<h3>✨ CAD Controls</h3>

<label>📷 Reference Photo</label>

<input id="photo" type="file" accept="image/*">

<img id="preview">

<label>Jewellery Type</label>

<select id="type">
<option value="bangle">💎 Bangle</option>
<option value="ring">💍 Ring</option>
<option value="bracelet">🔗 Bracelet</option>
<option value="necklace">📿 Necklace</option>
<option value="earring">✨ Earring</option>
</select>

<label>Metal</label>

<select id="metal">
<option value="yellow">🟡 Yellow Gold</option>
<option value="white">⚪ White Gold</option>
<option value="rose">🌹 Rose Gold</option>
</select>

<label>Stone</label>

<select id="stone">
<option value="diamond">💎 Diamond</option>
<option value="solitaire">💠 Solitaire</option>
<option value="none">None</option>
</select>

<label>
Size
<span class="value" id="sizeValue">3.0</span>
</label>

<input id="size"
type="range"
min="2"
max="5"
step="0.1"
value="3">

<label>
Thickness
<span class="value" id="thicknessValue">0.22</span>
</label>

<input id="thickness"
type="range"
min="0.10"
max="0.50"
step="0.01"
value="0.22">

<label>
Stones
<span class="value" id="stoneValue">24</span>
</label>

<input id="stoneCount"
type="range"
min="4"
max="60"
value="24">

<button class="generate" id="generate">
✨ Generate 3D CAD
</button>

<button id="reset">
🔄 Reset View
</button>

<button id="toggle">
👁️ Show / Hide Stones
</button>

<div class="status" id="status">
✅ 3D Viewer Ready
</div>

</div>

<div id="viewer"></div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import {OrbitControls} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


let scene;
let camera;
let renderer;
let controls;
let model;
let stones=[];

let stonesVisible=true;


const $=id=>document.getElementById(id);


/* =========================
   START THREE.JS
========================= */

function start(){

  scene=new THREE.Scene();

  scene.background=
    new THREE.Color(0x101217);


  camera=new THREE.PerspectiveCamera(
    45,
    window.innerWidth/
    (window.innerHeight-60),
    0.1,
    100
  );


  camera.position.set(
    0,
    2.5,
    8
  );


  renderer=new THREE.WebGLRenderer({
    antialias:true
  });


  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
  );


  renderer.setSize(
    window.innerWidth,
    window.innerHeight-60
  );


  $("viewer").appendChild(
    renderer.domElement
  );


  /* LIGHTS */

  scene.add(
    new THREE.AmbientLight(
      0xffffff,
      1.4
    )
  );


  const light1=
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  light1.position.set(
    5,8,6
  );

  scene.add(light1);


  const light2=
    new THREE.DirectionalLight(
      0xffffff,
      2
    );

  light2.position.set(
    -5,4,-4
  );

  scene.add(light2);


  const light3=
    new THREE.PointLight(
      0xffffff,
      2
    );

  light3.position.set(
    0,6,4
  );

  scene.add(light3);


  controls=new OrbitControls(
    camera,
    renderer.domElement
  );

  controls.enableDamping=true;

  controls.dampingFactor=.08;

  controls.minDistance=2;

  controls.maxDistance=20;


  window.addEventListener(
    "resize",
    resize
  );


  animate();

}


/* =========================
   MATERIALS
========================= */

function metalMaterial(){

  let color=0xd4af37;

  if($("metal").value==="white")
    color=0xdfe4e8;

  if($("metal").value==="rose")
    color=0xb76e79;


  return new THREE.MeshStandardMaterial({

    color:color,

    metalness:.9,

    roughness:.2

  });

}


function stoneMaterial(){

  return new THREE.MeshPhysicalMaterial({

    color:0xffffff,

    roughness:.03,

    metalness:0,

    transmission:.3,

    transparent:true,

    opacity:.98

  });

}


/* =========================
   CLEAR MODEL
========================= */

function clearModel(){

  if(model){

    scene.remove(model);

  }

  model=new THREE.Group();

  stones=[];

  scene.add(model);

}


/* =========================
   GENERATE
========================= */

function generate(){

  clearModel();

  const type=$("type").value;

  if(type==="bangle")
    bangle();

  else if(type==="ring")
    ring();

  else if(type==="bracelet")
    bracelet();

  else if(type==="necklace")
    necklace();

  else if(type==="earring")
    earring();


  $("status").innerHTML=
    "✅ "+type+
    " 3D CAD generated";


  resetView();

}


/* =========================
   BANGLE
========================= */

function bangle(){

  const r=
    parseFloat($("size").value);

  const t=
    parseFloat($("thickness").value);


  const mesh=new THREE.Mesh(

    new THREE.TorusGeometry(
      r,t,32,128
    ),

    metalMaterial()

  );


  mesh.rotation.x=
    Math.PI/2;


  model.add(mesh);


  circularStones(
    r,
    parseInt($("stoneCount").value),
    t
  );

}


/* =========================
   RING
========================= */

function ring(){

  const r=
    parseFloat($("size").value)*.7;

  const t=
    parseFloat($("thickness").value);


  const mesh=new THREE.Mesh(

    new THREE.TorusGeometry(
      r,t,32,128
    ),

    metalMaterial()

  );


  mesh.rotation.x=
    Math.PI/2;


  model.add(mesh);


  if($("stone").value!=="none"){

    const stone=new THREE.Mesh(

      new THREE.OctahedronGeometry(
        t*2.5,
        2
      ),

      stoneMaterial()

    );


    stone.position.set(
      0,
      r+.15,
      0
    );


    model.add(stone);

    stones.push(stone);

  }

}


/* =========================
   BRACELET
========================= */

function bracelet(){

  const r=
    parseFloat($("size").value)*.75;

  const t=
    parseFloat($("thickness").value);


  for(let i=0;i<12;i++){

    const a=
      i/12*Math.PI*2;


    const link=new THREE.Mesh(

      new THREE.TorusGeometry(
        .5,
        t,
        20,
        40
      ),

      metalMaterial()

    );


    link.position.set(
      Math.cos(a)*r,
      0,
      Math.sin(a)*r
    );


    link.rotation.x=
      Math.PI/2;

    link.rotation.y=a;


    model.add(link);

  }


  circularStones(
    r,
    parseInt($("stoneCount").value),
    t
  );

}


/* =========================
   NECKLACE
========================= */

function necklace(){

  const size=
    parseFloat($("size").value);


  const curve=
    new THREE.EllipseCurve(
      0,
      0,
      size*1.5,
      size*.9,
      0,
      Math.PI*2,
      false,
      0
    );


  const points=
    curve.getPoints(100);


  const path=
    new THREE.CatmullRomCurve3(

      points.map(
        p=>new THREE.Vector3(
          p.x,
          0,
          p.y
        )
      )

    );


  const tube=new THREE.Mesh(

    new THREE.TubeGeometry(
      path,
      100,
      parseFloat($("thickness").value)*.55,
      12,
      false
    ),

    metalMaterial()

  );


  model.add(tube);


  circularNecklaceStones(
    points
  );

}


/* =========================
   EARRING
========================= */

function earring(){

  const size=
    parseFloat($("size").value);

  const t=
    parseFloat($("thickness").value);


  const hoop=new THREE.Mesh(

    new THREE.TorusGeometry(
      size*.7,
      t,
      32,
      80
    ),

    metalMaterial()

  );


  hoop.rotation.x=
    Math.PI/2;


  model.add(hoop);


  if($("stone").value!=="none"){

    const stone=new THREE.Mesh(

      new THREE.OctahedronGeometry(
        t*2.5,
        2
      ),

      stoneMaterial()

    );


    stone.position.set(
      0,
      size*.7,
      0
    );


    model.add(stone);

    stones.push(stone);

  }

}


/* =========================
   CIRCULAR STONES
========================= */

function circularStones(
  radius,
  count,
  size
){

  if($("stone").value==="none")
    return;


  const geometry=
    new THREE.OctahedronGeometry(
      size*.8,
      1
    );


  const material=
    stoneMaterial();


  for(let i=0;i<count;i++){

    const a=
      i/count*Math.PI*2;


    const s=new THREE.Mesh(
      geometry,
      material
    );


    s.position.set(

      Math.cos(a)*radius,

      size*1.15,

      Math.sin(a)*radius

    );


    model.add(s);

    stones.push(s);

  }

}


/* =========================
   NECKLACE STONES
========================= */

function circularNecklaceStones(
  points
){

  if($("stone").value==="none")
    return;


  const count=
    Math.min(
      parseInt($("stoneCount").value),
      points.length
    );


  const geometry=
    new THREE.OctahedronGeometry(
      parseFloat($("thickness").value)*1.1,
      1
    );


  for(let i=0;i<count;i++){

    const index=
      Math.floor(
        i/(count-1)*
        (points.length-1)
      );


    const p=points[index];


    const s=new THREE.Mesh(
      geometry,
      stoneMaterial()
    );


    s.position.set(
      p.x,
      .12,
      p.y
    );


    model.add(s);

    stones.push(s);

  }

}


/* =========================
   RESET
========================= */

function resetView(){

  camera.position.set(
    0,
    2.5,
    8
  );


  controls.target.set(
    0,0,0
  );


  controls.update();

}


/* =========================
   STONES
========================= */

function toggleStones(){

  stonesVisible=
    !stonesVisible;


  stones.forEach(
    s=>s.visible=stonesVisible
  );

}


/* =========================
   PHOTO
========================= */

$("photo").addEventListener(
  "change",
  function(){

    const file=this.files[0];

    if(!file)return;


    const url=
      URL.createObjectURL(file);


    $("preview").src=url;

    $("preview").style.display=
      "block";


    $("status").innerHTML=
      "📷 Reference photo loaded";

  }
);


/* =========================
   CONTROLS
========================= */

$("generate").onclick=
  generate;

$("reset").onclick=
  resetView;

$("toggle").onclick=
  toggleStones;


$("type").onchange=
  generate;

$("metal").onchange=
  generate;

$("stone").onchange=
  generate;


$("size").oninput=
  function(){

    $("sizeValue").textContent=
      this.value;

  };


$("thickness").oninput=
  function(){

    $("thicknessValue").textContent=
      this.value;

  };


$("stoneCount").oninput=
  function(){

    $("stoneValue").textContent=
      this.value;

  };


/* =========================
   RESIZE
========================= */

function resize(){

  const h=
    window.innerHeight-60;


  camera.aspect=
    window.innerWidth/h;


  camera.updateProjectionMatrix();


  renderer.setSize(
    window.innerWidth,
    h
  );

}


/* =========================
   ANIMATION
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


/* START */

start();

</script>

</body>
</html>
