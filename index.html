<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jewellery CAD AI V1.2 Fixed</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111318;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#191c24;
  border-bottom:1px solid #333;
}

header h2{
  margin:0;
  font-size:20px;
}

header span{
  color:#aaa;
  font-size:13px;
}

#viewer{
  width:100vw;
  height:calc(100vh - 60px);
}

.panel{
  position:fixed;
  left:10px;
  top:70px;
  width:245px;
  max-height:calc(100vh - 80px);
  overflow-y:auto;
  padding:14px;
  background:rgba(25,28,36,.97);
  border:1px solid #444;
  border-radius:14px;
  z-index:10;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.panel h3{
  margin:0 0 12px;
}

label{
  display:block;
  font-size:13px;
  margin-top:11px;
  color:#bbb;
}

select,
input[type=file]{
  width:100%;
  margin-top:6px;
  padding:9px;
  border-radius:8px;
  border:1px solid #555;
  background:#20242e;
  color:white;
}

input[type=range]{
  width:100%;
}

button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:9px;
  background:#444b5a;
  color:white;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.generate{
  background:#8c6a19;
}

.value{
  float:right;
  color:white;
}

#preview{
  width:100%;
  max-height:110px;
  object-fit:contain;
  margin-top:8px;
  border-radius:8px;
  display:none;
  border:1px solid #555;
}

.status{
  margin-top:10px;
  padding:9px;
  border-radius:8px;
  background:#20242e;
  color:#aaa;
  font-size:12px;
  line-height:1.4;
}

@media(max-width:600px){

  .panel{
    width:210px;
    left:7px;
    top:67px;
    padding:11px;
  }

  header h2{
    font-size:16px;
  }

  header span{
    display:none;
  }
}
</style>
</head>

<body>

<header>
  <h2>💎 Jewellery CAD AI V1.2</h2>
  <span>3D Jewellery Designer</span>
</header>

<div class="panel">

<h3>✨ CAD Controls</h3>

<label>Reference Photo</label>

<input
  id="photo"
  type="file"
  accept="image/*"
>

<img id="preview">

<label>Jewellery Type</label>

<select id="jewelleryType">

<option value="bangle">Bangle</option>
<option value="ring">Ring</option>
<option value="bracelet">Bracelet</option>
<option value="necklace">Necklace</option>
<option value="earring">Earring</option>

</select>

<label>Metal</label>

<select id="metal">

<option value="yellow">Yellow Gold</option>
<option value="white">White Gold</option>
<option value="rose">Rose Gold</option>

</select>

<label>Stone</label>

<select id="stoneType">

<option value="diamond">Diamond</option>
<option value="solitaire">Solitaire</option>
<option value="none">None</option>

</select>

<label>
Size
<span class="value" id="sizeValue">3.0</span>
</label>

<input
  id="size"
  type="range"
  min="2"
  max="5"
  step="0.1"
  value="3"
>

<label>
Thickness
<span class="value" id="thickValue">0.22</span>
</label>

<input
  id="thickness"
  type="range"
  min="0.10"
  max="0.50"
  step="0.01"
  value="0.22"
>

<label>
Stones
<span class="value" id="stoneValue">24</span>
</label>

<input
  id="stones"
  type="range"
  min="4"
  max="60"
  step="1"
  value="24"
>

<button
  class="generate"
  onclick="generateCAD()"
>
✨ Generate CAD Concept
</button>

<button onclick="resetView()">
🔄 Reset View
</button>

<button onclick="toggleStones()">
👁️ Show / Hide Stones
</button>

<div
  class="status"
  id="status"
>
Ready — Select jewellery type and generate.
</div>

</div>

<div id="viewer"></div>


<!-- THREE.JS -->

<script type="module">

import * as THREE
from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import {
  OrbitControls
}
from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


let scene;
let camera;
let renderer;
let controls;

let jewelleryGroup;

let stones = [];

let showStones = true;


const params = {

  size:3,

  thickness:0.22,

  stones:24

};


init();

generateCAD();


function init(){

  scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0x111318);


  camera =
    new THREE.PerspectiveCamera(
      45,
      window.innerWidth /
      (window.innerHeight - 60),
      0.1,
      100
    );


  camera.position.set(
    0,
    3.5,
    8
  );


  renderer =
    new THREE.WebGLRenderer({
      antialias:true
    });


  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
  );


  renderer.setSize(
    window.innerWidth,
    window.innerHeight - 60
  );


  document
    .getElementById("viewer")
    .appendChild(renderer.domElement);


  /* LIGHTS */

  const ambient =
    new THREE.AmbientLight(
      0xffffff,
      1.2
    );

  scene.add(ambient);


  const light1 =
    new THREE.DirectionalLight(
      0xffffff,
      2.5
    );

  light1.position.set(
    5,
    7,
    6
  );

  scene.add(light1);


  const light2 =
    new THREE.DirectionalLight(
      0xffffff,
      1.5
    );

  light2.position.set(
    -5,
    3,
    -5
  );

  scene.add(light2);


  const light3 =
    new THREE.PointLight(
      0xffffff,
      1.5
    );

  light3.position.set(
    0,
    5,
    3
  );

  scene.add(light3);


  /* CONTROLS */

  controls =
    new OrbitControls(
      camera,
      renderer.domElement
    );

  controls.enableDamping = true;

  controls.dampingFactor = 0.08;

  controls.minDistance = 3;

  controls.maxDistance = 20;


  window.addEventListener(
    "resize",
    resize
  );


  animate();

}


function metalColor(){

  const metal =
    document.getElementById(
      "metal"
    ).value;


  if(metal === "white"){

    return 0xd9dde2;

  }


  if(metal === "rose"){

    return 0xb76e79;

  }


  return 0xd4af37;

}


function metalMaterial(){

  return new THREE.MeshStandardMaterial({

    color:metalColor(),

    metalness:0.9,

    roughness:0.18

  });

}


function stoneMaterial(){

  return new THREE.MeshPhysicalMaterial({

    color:0xffffff,

    metalness:0,

    roughness:0.05,

    transmission:0.25,

    transparent:true,

    opacity:0.95

  });

}


function clearModel(){

  if(jewelleryGroup){

    scene.remove(
      jewelleryGroup
    );

  }


  stones = [];


  jewelleryGroup =
    new THREE.Group();


  scene.add(
    jewelleryGroup
  );

}


function generateCAD(){

  params.size =
    parseFloat(
      document.getElementById(
        "size"
      ).value
    );


  params.thickness =
    parseFloat(
      document.getElementById(
        "thickness"
      ).value
    );


  params.stones =
    parseInt(
      document.getElementById(
        "stones"
      ).value
    );


  updateLabels();


  clearModel();


  const type =
    document.getElementById(
      "jewelleryType"
    ).value;


  if(type === "bangle"){

    createBangle();

  }


  else if(type === "ring"){

    createRing();

  }


  else if(type === "bracelet"){

    createBracelet();

  }


  else if(type === "necklace"){

    createNecklace();

  }


  else if(type === "earring"){

    createEarring();

  }


  resetView();


  document.getElementById(
    "status"
  ).innerHTML =
    "✅ 3D model generated: " +
    type;

}


/* BANGLE */

function createBangle(){

  const radius =
    params.size;

  const tube =
    params.thickness;


  const ring =
    new THREE.Mesh(

      new THREE.TorusGeometry(
        radius,
        tube,
        32,
        128
      ),

      metalMaterial()

    );


  ring.rotation.x =
    Math.PI / 2;


  jewelleryGroup.add(
    ring
  );


  addCircularStones(
    radius,
    params.stones,
    tube
  );

}


/* RING */

function createRing(){

  const radius =
    params.size * 0.72;

  const tube =
    params.thickness;


  const ring =
    new THREE.Mesh(

      new THREE.TorusGeometry(
        radius,
        tube,
        32,
        128
      ),

      metalMaterial()

    );


  ring.rotation.x =
    Math.PI / 2;


  jewelleryGroup.add(
    ring
  );


  const stoneType =
    document.getElementById(
      "stoneType"
    ).value;


  if(stoneType !== "none"){

    const stone =
      new THREE.Mesh(

        new THREE.OctahedronGeometry(
          tube * 2.2,
          2
        ),

        stoneMaterial()

      );


    stone.position.set(
      0,
      radius * 0.95,
      0
    );


    jewelleryGroup.add(
      stone
    );


    stones.push(
      stone
    );

  }

}


/* BRACELET */

function createBracelet(){

  const links = 12;

  const radius =
    params.size * 0.75;


  for(
    let i=0;
    i<links;
    i++
  ){

    const angle =
      (i / links) *
      Math.PI * 2;


    const x =
      Math.cos(angle) *
      radius;


    const z =
      Math.sin(angle) *
      radius;


    const link =
      new THREE.Mesh(

        new THREE.TorusGeometry(
          0.55,
          params.thickness,
          20,
          40
        ),

        metalMaterial()

      );


    link.position.set(
      x,
      0,
      z
    );


    link.rotation.x =
      Math.PI / 2;


    link.rotation.y =
      angle;


    jewelleryGroup.add(
      link
    );

  }


  addCircularStones(
    radius,
    params.stones,
    params.thickness
  );

}


/* NECKLACE */

function createNecklace(){

  const curve =
    new THREE.EllipseCurve(
      0,
      0,
      params.size * 1.5,
      params.size * 0.9,
      Math.PI * 0.05,
      Math.PI * 0.95,
      false,
      0
    );


  const points =
    curve.getPoints(80);


  const path =
    new THREE.CatmullRomCurve3(

      points.map(
        p =>
          new THREE.Vector3(
            p.x,
            0,
            p.y
          )
      )

    );


  const tube =
    new THREE.Mesh(

      new THREE.TubeGeometry(
        path,
        100,
        params.thickness * 0.55,
        12,
        false
      ),

      metalMaterial()

    );


  jewelleryGroup.add(
    tube
  );


  addNecklaceStones(
    points
  );

}


/* EARRING */

function createEarring(){

  const group =
    new THREE.Group();


  const hoop =
    new THREE.Mesh(

      new THREE.TorusGeometry(
        params.size * 0.7,
        params.thickness,
        24,
        64
      ),

      metalMaterial()

    );


  hoop.rotation.x =
    Math.PI / 2;


  group.add(
    hoop
  );


  const stoneType =
    document.getElementById(
      "stoneType"
    ).value;


  if(stoneType !== "none"){

    const stone =
      new THREE.Mesh(

        new THREE.OctahedronGeometry(
          params.thickness * 2,
          2
        ),

        stoneMaterial()

      );


    stone.position.set(
      0,
      params.size * 0.7,
      0
    );


    group.add(
      stone
    );


    stones.push(
      stone
    );

  }


  jewelleryGroup.add(
    group
  );

}


/* CIRCULAR STONES */

function addCircularStones(
  radius,
  count,
  size
){

  const type =
    document.getElementById(
      "stoneType"
    ).value;


  if(type === "none"){

    return;

  }


  const geo =
    new THREE.OctahedronGeometry(
      size * 0.8,
      1
    );


  const material =
    stoneMaterial();


  for(
    let i=0;
    i<count;
    i++
  ){

    const angle =
      (i / count) *
      Math.PI * 2;


    const stone =
      new THREE.Mesh(
        geo,
        material
      );


    stone.position.set(

      Math.cos(angle) *
      radius,

      size * 1.15,

      Math.sin(angle) *
      radius

    );


    jewelleryGroup.add(
      stone
    );


    stones.push(
      stone
    );

  }

}


/* NECKLACE STONES */

function addNecklaceStones(
  points
){

  const type =
    document.getElementById(
      "stoneType"
    ).value;


  if(type === "none"){

    return;

  }


  const count =
    Math.min(
      params.stones,
      points.length
    );


  const geo =
    new THREE.OctahedronGeometry(
      params.thickness * 1.2,
      1
    );


  const material =
    stoneMaterial();


  for(
    let i=0;
    i<count;
    i++
  ){

    const index =
      Math.floor(

        (i /
          Math.max(
            count - 1,
            1
          )) *
        (points.length - 1)

      );


    const p =
      points[index];


    const stone =
      new THREE.Mesh(
        geo,
        material
      );


    stone.position.set(
      p.x,
      0.15,
      p.y
    );


    jewelleryGroup.add(
      stone
    );


    stones.push(
      stone
    );

  }

}


/* LABELS */

function updateLabels(){

  document.getElementById(
    "sizeValue"
  ).textContent =
    params.size.toFixed(1);


  document.getElementById(
    "thickValue"
  ).textContent =
    params.thickness.toFixed(2);


  document.getElementById(
    "stoneValue"
  ).textContent =
    params.stones;

}


/* RANGE EVENTS */

document.getElementById(
  "size"
).addEventListener(
  "input",
  updateLabels
);


document.getElementById(
  "thickness"
).addEventListener(
  "input",
  updateLabels
);


document.getElementById(
  "stones"
).addEventListener(
  "input",
  updateLabels
);


/* AUTO GENERATE */

document.getElementById(
  "jewelleryType"
).addEventListener(
  "change",
  generateCAD
);


document.getElementById(
  "metal"
).addEventListener(
  "change",
  generateCAD
);


document.getElementById(
  "stoneType"
).addEventListener(
  "change",
  generateCAD
);


/* PHOTO */

document.getElementById(
  "photo"
).addEventListener(
  "change",
  function(){

    const file =
      this.files[0];


    if(!file){

      return;

    }


    const url =
      URL.createObjectURL(
        file
      );


    const preview =
      document.getElementById(
        "preview"
      );


    preview.src =
      url;


    preview.style.display =
      "block";


    document.getElementById(
      "status"
    ).innerHTML =
      "📷 Reference image loaded.";

  }
);


/* STONE VISIBILITY */

window.toggleStones =
  function(){

    showStones =
      !showStones;


    stones.forEach(
      stone => {

        stone.visible =
          showStones;

      }
    );

  };


/* RESET */

window.resetView =
  function(){

    camera.position.set(
      0,
      3.5,
      8
    );


    controls.target.set(
      0,
      0,
      0
    );


    controls.update();

  };


/* RESIZE */

function resize(){

  const height =
    window.innerHeight - 60;


  camera.aspect =
    window.innerWidth /
    height;


  camera.updateProjectionMatrix();


  renderer.setSize(
    window.innerWidth,
    height
  );

}


/* ANIMATION */

function animate(){

  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}

</script>

</body>
</html>
