<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Jewellery CAD AI V2.3</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b0b0b;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  height:58px;
  background:#151515;
  display:flex;
  align-items:center;
  padding:0 15px;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #333;
}

.container{
  padding:12px;
  max-width:900px;
  margin:auto;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.box{
  background:#171717;
  padding:10px;
  border-radius:10px;
}

label{
  display:block;
  font-size:13px;
  color:#bbb;
  margin-bottom:5px;
}

select,
input{
  width:100%;
  padding:10px;
  border-radius:7px;
  border:1px solid #444;
  background:#222;
  color:white;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  font-size:15px;
  font-weight:bold;
  background:#d4af37;
  color:#111;
}

button.secondary{
  background:#333;
  color:white;
}

.reference{
  margin-top:10px;
  background:#171717;
  padding:10px;
  border-radius:10px;
}

#preview{
  width:100%;
  max-height:180px;
  object-fit:contain;
  margin-top:8px;
  display:none;
  border-radius:8px;
}

.viewer{
  margin-top:12px;
  height:480px;
  background:#020202;
  border:1px solid #333;
  border-radius:12px;
  overflow:hidden;
  position:relative;
}

#viewer{
  width:100%;
  height:100%;
}

.status{
  position:absolute;
  left:10px;
  top:10px;
  z-index:5;
  background:rgba(0,0,0,.7);
  padding:7px 10px;
  border-radius:7px;
  font-size:12px;
  color:#ddd;
}

.error{
  display:none;
  position:absolute;
  z-index:10;
  left:10px;
  right:10px;
  top:50px;
  background:#3b1010;
  color:#ffb0b0;
  padding:12px;
  border-radius:8px;
  font-size:13px;
}

@media(max-width:600px){
  .controls{
    grid-template-columns:1fr 1fr;
  }

  .viewer{
    height:430px;
  }
}
</style>
</head>

<body>

<header>
💎 Jewellery CAD AI V2.3
</header>

<div class="container">

<div class="controls">

<div class="box">
<label>Jewellery Type</label>
<select id="type">
<option value="bangle">Bangle</option>
<option value="ring">Ring</option>
<option value="bracelet">Bracelet</option>
<option value="necklace">Necklace</option>
<option value="earring">Earring</option>
</select>
</div>

<div class="box">
<label>Metal</label>
<select id="metal">
<option value="yellow">Yellow Gold</option>
<option value="white">White Gold</option>
<option value="rose">Rose Gold</option>
</select>
</div>

<div class="box">
<label>Stone</label>
<select id="stone">
<option value="diamond">Diamond</option>
<option value="solitaire">Solitaire</option>
<option value="none">None</option>
</select>
</div>

<div class="box">
<label>Size</label>
<select id="size">
<option value="2.2">2.2</option>
<option value="2.4">2.4</option>
<option value="2.5" selected>2.5</option>
<option value="2.6">2.6</option>
<option value="2.8">2.8</option>
<option value="3.0">3.0</option>
</select>
</div>

<div class="box">
<label>Thickness</label>
<input id="thickness"
type="range"
min="0.15"
max="0.50"
step="0.01"
value="0.28"
oninput="thicknessValue.innerText=this.value">

<div style="text-align:center;margin-top:5px">
<span id="thicknessValue">0.28</span>
</div>
</div>

<div class="box">
<label>Diamonds</label>
<input id="diamondCount"
type="range"
min="0"
max="48"
step="1"
value="24"
oninput="diamondValue.innerText=this.value">

<div style="text-align:center;margin-top:5px">
<span id="diamondValue">24</span>
</div>
</div>

</div>

<div class="reference">

<label>Reference Photo</label>

<input
type="file"
id="reference"
accept="image/*">

<img id="preview">

</div>

<button onclick="generateCAD()">
✨ Generate CAD
</button>

<button class="secondary" onclick="resetCAD()">
↻ Reset
</button>

<button class="secondary" onclick="toggleStones()">
💎 Show / Hide Stones
</button>

<div class="viewer">

<div class="status" id="status">
V2.3 Starting...
</div>

<div class="error" id="error"></div>

<div id="viewer"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

let scene;
let camera;
let renderer;
let controls;

let jewelleryGroup;
let stoneGroup;

let stonesVisible=true;


/* ---------------------------
   START
--------------------------- */

function init(){

try{

scene=new THREE.Scene();

scene.background=new THREE.Color(0x050505);


/* CAMERA */

camera=new THREE.PerspectiveCamera(
45,
window.innerWidth/
document.getElementById("viewer").clientHeight,
0.1,
1000
);

camera.position.set(0,4,8);


/* RENDERER */

renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
document.getElementById("viewer").clientWidth,
document.getElementById("viewer").clientHeight
);

document
.getElementById("viewer")
.appendChild(renderer.domElement);


/* CONTROLS */

controls=new THREE.OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping=true;

controls.dampingFactor=0.06;


/* LIGHT */

scene.add(
new THREE.AmbientLight(
0xffffff,
1.4
)
);

let light1=new THREE.DirectionalLight(
0xffffff,
2
);

light1.position.set(5,8,6);

scene.add(light1);

let light2=new THREE.DirectionalLight(
0xffffff,
1.5
);

light2.position.set(-5,3,-4);

scene.add(light2);


/* GROUPS */

jewelleryGroup=new THREE.Group();

stoneGroup=new THREE.Group();

scene.add(jewelleryGroup);

scene.add(stoneGroup);


/* FIRST MODEL */

generateCAD();


/* RESIZE */

window.addEventListener(
"resize",
onResize
);


/* STATUS */

document.getElementById("status")
.innerText="V2.3 Ready";

animate();

}catch(e){

showError(e);

}

}


/* ---------------------------
   METAL
--------------------------- */

function getMetal(){

let value=
document.getElementById("metal").value;

if(value==="white"){

return new THREE.MeshStandardMaterial({

color:0xd8d8d8,

metalness:.95,

roughness:.18

});

}

if(value==="rose"){

return new THREE.MeshStandardMaterial({

color:0xb76e79,

metalness:.95,

roughness:.2

});

}

return new THREE.MeshStandardMaterial({

color:0xd4af37,

metalness:.95,

roughness:.2

});

}


/* ---------------------------
   STONE
--------------------------- */

function getStone(){

return new THREE.MeshPhysicalMaterial({

color:0xffffff,

metalness:.05,

roughness:.02,

transmission:.1,

transparent:true,

opacity:.95

});

}


/* ---------------------------
   CLEAR MODEL
--------------------------- */

function clearModel(){

while(
jewelleryGroup.children.length>0
){

let obj=
jewelleryGroup.children[0];

jewelleryGroup.remove(obj);

}

while(
stoneGroup.children.length>0
){

let obj=
stoneGroup.children[0];

stoneGroup.remove(obj);

}

}


/* ---------------------------
   GENERATE
--------------------------- */

function generateCAD(){

try{

clearModel();

let type=
document.getElementById("type").value;

if(type==="bangle"){

createBangle();

}

else if(type==="ring"){

createRing();

}

else if(type==="bracelet"){

createBracelet();

}

else if(type==="necklace"){

createNecklace();

}

else if(type==="earring"){

createEarring();

}

document.getElementById("status")
.innerText="CAD Generated ✓";

}catch(e){

showError(e);

}

}


/* ---------------------------
   BANGLE
--------------------------- */

function createBangle(){

let size=
parseFloat(
document.getElementById("size").value
);

let thickness=
parseFloat(
document.getElementById("thickness").value
);

let count=
parseInt(
document.getElementById("diamondCount").value
);

let radius=
2.7+(size-2.5)*1.2;


/* MAIN GOLD BANGLE */

let torus=
new THREE.Mesh(

new THREE.TorusGeometry(
radius,
thickness,
32,
128
),

getMetal()

);

torus.rotation.x=
Math.PI/2;

jewelleryGroup.add(torus);


/* DIAMONDS */

if(
document.getElementById("stone").value!=="none"
){

for(
let i=0;
i<count;
i++
){

let angle=
(i/count)*Math.PI*2;

let x=
Math.cos(angle)*radius;

let z=
Math.sin(angle)*radius;

createDiamond(
x,
0,
z,
angle,
thickness
);

}

}

}


/* ---------------------------
   DIAMOND + PRONGS
--------------------------- */

function createDiamond(
x,
y,
z,
angle,
thickness
){

let group=
new THREE.Group();


/* DIAMOND */

let diamond=
new THREE.Mesh(

new THREE.OctahedronGeometry(
Math.max(.09,thickness*.65),
1
),

getStone()

);

diamond.position.set(
0,
thickness+.10,
0
);

group.add(diamond);


/* 4 PRONGS */

let prongMaterial=
getMetal();

for(
let i=0;
i<4;
i++
){

let a=
(i/4)*Math.PI*2;

let px=
Math.cos(a)*.10;

let pz=
Math.sin(a)*.10;

let prong=
new THREE.Mesh(

new THREE.CylinderGeometry(
.018,
.018,
.16,
8
),

prongMaterial

);

prong.position.set(
px,
thickness+.02,
pz
);

group.add(prong);

}


group.position.set(
x,
y,
z
);

group.rotation.y=
-angle;

stoneGroup.add(group);

}


/* ---------------------------
   RING
--------------------------- */

function createRing(){

let thickness=
parseFloat(
document.getElementById("thickness").value
);

let ring=
new THREE.Mesh(

new THREE.TorusGeometry(
1.8,
thickness,
32,
96
),

getMetal()

);

ring.rotation.x=
Math.PI/2;

jewelleryGroup.add(ring);


/* CENTER STONE */

if(
document.getElementById("stone").value!=="none"
){

let diamond=
new THREE.Mesh(

new THREE.OctahedronGeometry(
.42,
2
),

getStone()

);

diamond.position.y=
thickness+.45;

stoneGroup.add(diamond);

}

}


/* ---------------------------
   BRACELET
--------------------------- */

function createBracelet(){

let thickness=
parseFloat(
document.getElementById("thickness").value
);

let radius=2.7;

let torus=
new THREE.Mesh(

new THREE.TorusGeometry(
radius,
thickness,
24,
96
),

getMetal()

);

torus.rotation.x=
Math.PI/2;

jewelleryGroup.add(torus);

let count=
parseInt(
document.getElementById("diamondCount").value
);

if(
document.getElementById("stone").value!=="none"
){

for(
let i=0;
i<count;
i++
){

let a=
(i/count)*Math.PI*2;

createDiamond(
Math.cos(a)*radius,
0,
Math.sin(a)*radius,
a,
thickness
);

}

}

}


/* ---------------------------
   NECKLACE
--------------------------- */

function createNecklace(){

let material=
getMetal();

let curve=
new THREE.EllipseCurve(
0,
0,
3.2,
2.2,
0,
Math.PI*2,
false,
0
);

let points=
curve.getPoints(100);

let geometry=
new THREE.BufferGeometry()
.setFromPoints(
points.map(
p=>new THREE.Vector3(
p.x,
0,
p.y
)
)
);

let line=
new THREE.LineLoop(

geometry,

new THREE.LineBasicMaterial({
color:material.color
})

);

jewelleryGroup.add(line);


/* CENTER PENDANT */

if(
document.getElementById("stone").value!=="none"
){

let diamond=
new THREE.Mesh(

new THREE.OctahedronGeometry(
.55,
2
),

getStone()

);

diamond.position.set(
0,
-.05,
2.2
);

stoneGroup.add(diamond);

}

}


/* ---------------------------
   EARRING
--------------------------- */

function createEarring(){

let material=
getMetal();

let hoop=
new THREE.Mesh(

new THREE.TorusGeometry(
1.4,
parseFloat(
document.getElementById("thickness").value
),
24,
72
),

material

);

hoop.rotation.x=
Math.PI/2;

jewelleryGroup.add(hoop);

if(
document.getElementById("stone").value!=="none"
){

let diamond=
new THREE.Mesh(

new THREE.OctahedronGeometry(
.35,
2
),

getStone()

);

diamond.position.y=.4;

stoneGroup.add(diamond);

}

}


/* ---------------------------
   STONES
--------------------------- */

function toggleStones(){

stonesVisible=
!stonesVisible;

stoneGroup.visible=
stonesVisible;

document.getElementById("status")
.innerText=
stonesVisible
?
"Stones Visible"
:
"Stones Hidden";

}


/* ---------------------------
   RESET
--------------------------- */

function resetCAD(){

document.getElementById("type").value="bangle";

document.getElementById("metal").value="yellow";

document.getElementById("stone").value="diamond";

document.getElementById("size").value="2.5";

document.getElementById("thickness").value="0.28";

document.getElementById("thicknessValue").innerText="0.28";

document.getElementById("diamondCount").value="24";

document.getElementById("diamondValue").innerText="24";

stonesVisible=true;

stoneGroup.visible=true;

generateCAD();

}


/* ---------------------------
   PHOTO PREVIEW
--------------------------- */

document.getElementById("reference")
.addEventListener(
"change",
function(){

let file=this.files[0];

if(!file)return;

let url=
URL.createObjectURL(file);

let img=
document.getElementById("preview");

img.src=url;

img.style.display="block";

}
);


/* ---------------------------
   RESIZE
--------------------------- */

function onResize(){

let box=
document.getElementById("viewer");

let w=box.clientWidth;

let h=box.clientHeight;

camera.aspect=
w/h;

camera.updateProjectionMatrix();

renderer.setSize(
w,
h
);

}


/* ---------------------------
   ANIMATION
--------------------------- */

function animate(){

requestAnimationFrame(
animate
);

controls.update();

renderer.render(
scene,
camera
);

}


/* ---------------------------
   ERROR
--------------------------- */

function showError(e){

let error=
document.getElementById("error");

error.style.display="block";

error.innerText=
"CAD Error: "+
e.message;

document.getElementById("status")
.innerText=
"Error";

console.error(e);

}


/* START */

init();

</script>

</body>
</html>
