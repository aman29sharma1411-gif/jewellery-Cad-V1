<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jewellery CAD AI V2.7</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#080808;
 color:#fff;
 font-family:Arial,sans-serif
}

header{
 height:62px;
 display:flex;
 align-items:center;
 padding:0 18px;
 background:#151515;
 border-bottom:1px solid #333;
 font-size:21px;
 font-weight:bold
}

.container{
 max-width:950px;
 margin:auto;
 padding:12px
}

.controls{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.box,.reference{
 background:#171717;
 border-radius:14px;
 padding:14px
}

label{
 display:block;
 color:#aaa;
 font-size:16px;
 margin-bottom:9px
}

select,input[type=file]{
 width:100%;
 padding:13px;
 background:#242424;
 color:white;
 border:1px solid #444;
 border-radius:9px;
 font-size:16px
}

input[type=range]{
 width:100%;
 accent-color:#e0b933
}

.value{
 text-align:center;
 font-size:18px;
 margin-top:8px
}

button{
 width:100%;
 padding:15px;
 margin-top:10px;
 border:0;
 border-radius:11px;
 font-size:18px;
 font-weight:bold;
 background:#ddb735;
 color:#111
}

button.secondary{
 background:#333;
 color:#fff
}

.viewButtons{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:8px
}

.viewButtons button{
 font-size:14px
}

.reference{
 margin-top:10px
}

#preview{
 display:none;
 width:100%;
 max-height:180px;
 object-fit:contain;
 margin-top:10px;
 border-radius:8px
}

.viewer{
 position:relative;
 height:520px;
 margin-top:12px;
 background:#000;
 border:1px solid #333;
 border-radius:15px;
 overflow:hidden
}

#viewer{
 width:100%;
 height:100%
}

.status{
 position:absolute;
 z-index:5;
 top:10px;
 left:10px;
 background:rgba(0,0,0,.78);
 padding:8px 12px;
 border-radius:8px;
 font-size:13px
}

.info{
 margin-top:10px;
 padding:10px;
 background:#121212;
 border-radius:9px;
 color:#aaa;
 font-size:13px;
 text-align:center
}

@media(max-width:600px){
 .viewer{height:480px}
}
</style>
</head>

<body>

<header>💎 Jewellery CAD AI V2.7</header>

<div class="container">

<div class="controls">

<div class="box">
<label>Jewellery Type</label>
<select id="type">
<option value="bangle">Bangle</option>
<option value="ring">Ring</option>
<option value="bracelet">Bracelet</option>
<option value="necklace">Necklace</option>
<option value="earring">Earring</option>
</select>
</div>

<div class="box">
<label>Metal</label>
<select id="metal">
<option value="yellow">Yellow Gold</option>
<option value="white">White Gold</option>
<option value="rose">Rose Gold</option>
</select>
</div>

<div class="box">
<label>Stone</label>
<select id="stone">
<option value="diamond">Diamond</option>
<option value="solitaire">Solitaire</option>
<option value="none">None</option>
</select>
</div>

<div class="box">
<label>Design Style</label>
<select id="style">
<option value="classic">Classic</option>
<option value="pave">Pavé</option>
<option value="solitaire">Solitaire</option>
</select>
</div>

<div class="box">
<label>Size</label>
<select id="size">
<option value="2.2">2.2</option>
<option value="2.4">2.4</option>
<option value="2.5" selected>2.5</option>
<option value="2.6">2.6</option>
<option value="2.8">2.8</option>
<option value="3.0">3.0</option>
</select>
</div>

<div class="box">
<label>Thickness</label>
<input id="thickness" type="range"
min="0.16" max="0.50" step="0.01" value="0.28">
<div class="value" id="thicknessValue">0.28</div>
</div>

<div class="box">
<label>Diamonds</label>
<input id="diamondCount" type="range"
min="0" max="60" step="1" value="24">
<div class="value" id="diamondValue">24</div>
</div>

<div class="box">
<label>Diamond Size</label>
<select id="diamondSize">
<option value="small">Small</option>
<option value="medium" selected>Medium</option>
<option value="large">Large</option>
</select>
</div>

</div>

<div class="reference">
<label>Reference Photo</label>
<input id="reference" type="file" accept="image/*">
<img id="preview">
</div>

<button id="generate">✨ Generate CAD</button>

<button class="secondary" id="reset">↻ Reset</button>

<button class="secondary" id="stones">
💎 Show / Hide Stones
</button>

<div class="viewButtons">
<button class="secondary" id="front">Front</button>
<button class="secondary" id="top">Top</button>
<button class="secondary" id="view3d">3D View</button>
</div>

<div class="viewer">
<div class="status" id="status">V2.7 Live Preview ✓</div>
<div id="viewer"></div>
</div>

<div class="info">
👆 Drag = Rotate &nbsp; • &nbsp;
🤏 Pinch = Zoom &nbsp; • &nbsp;
2 Fingers = Pan
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

let scene;
let camera;
let renderer;
let controls;

let jewelleryGroup;
let stoneGroup;

let stonesVisible=true;


/* =========================
   INITIALIZE
========================= */

function init(){

const viewer=document.getElementById("viewer");

scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);

camera=new THREE.PerspectiveCamera(
42,
viewer.clientWidth/viewer.clientHeight,
0.1,
1000
);

camera.position.set(0,4.5,8.5);

renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
viewer.clientWidth,
viewer.clientHeight
);

renderer.outputEncoding=THREE.sRGBEncoding;

viewer.appendChild(renderer.domElement);


/* CONTROLS */

controls=new THREE.OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping=true;
controls.dampingFactor=.07;
controls.minDistance=3;
controls.maxDistance=15;


/* LIGHTING */

scene.add(
new THREE.AmbientLight(
0xffffff,
1.6
)
);

const keyLight=new THREE.DirectionalLight(
0xffffff,
3.2
);

keyLight.position.set(5,8,6);
scene.add(keyLight);

const fillLight=new THREE.DirectionalLight(
0xffffff,
2
);

fillLight.position.set(-6,4,-4);
scene.add(fillLight);

const rimLight=new THREE.DirectionalLight(
0xffffff,
2
);

rimLight.position.set(0,3,-8);
scene.add(rimLight);


/* GROUPS */

jewelleryGroup=new THREE.Group();
stoneGroup=new THREE.Group();

scene.add(jewelleryGroup);
scene.add(stoneGroup);


/* FIRST MODEL */

generateCAD();

window.addEventListener(
"resize",
resize
);

animate();

}


/* =========================
   METAL MATERIAL
========================= */

function getMetalMaterial(){

const metal=document.getElementById("metal").value;

if(metal==="white"){

return new THREE.MeshStandardMaterial({
color:0xdfe4e8,
metalness:1,
roughness:.12
});

}

if(metal==="rose"){

return new THREE.MeshStandardMaterial({
color:0xc98383,
metalness:1,
roughness:.13
});

}

return new THREE.MeshStandardMaterial({
color:0xd4af37,
metalness:1,
roughness:.12
});

}


/* =========================
   DIAMOND MATERIAL
========================= */

function getDiamondMaterial(){

return new THREE.MeshPhysicalMaterial({
color:0xffffff,
metalness:0,
roughness:.02,
transmission:.35,
transparent:true,
opacity:.98,
reflectivity:1,
clearcoat:1,
clearcoatRoughness:.02
});

}


/* =========================
   DIAMOND CUT
========================= */

function makeDiamond(radius){

const geometry=new THREE.OctahedronGeometry(
radius,
1
);

const diamond=new THREE.Mesh(
geometry,
getDiamondMaterial()
);

return diamond;

}


/* =========================
   CLEAR MODEL
========================= */

function clearModel(){

while(jewelleryGroup.children.length){

jewelleryGroup.remove(
jewelleryGroup.children[0]
);

}

while(stoneGroup.children.length){

stoneGroup.remove(
stoneGroup.children[0]
);

}

}


/* =========================
   MAIN GENERATOR
========================= */

function generateCAD(){

clearModel();

const type=
document.getElementById("type").value;

if(type==="bangle")
createBangle();

if(type==="ring")
createRing();

if(type==="bracelet")
createBracelet();

if(type==="necklace")
createNecklace();

if(type==="earring")
createEarring();

stoneGroup.visible=stonesVisible;

document.getElementById("status").innerText=
"V2.7 Live CAD ✓";

}


/* =========================
   BANGLE
========================= */

function createBangle(){

const size=parseFloat(
document.getElementById("size").value
);

const thickness=parseFloat(
document.getElementById("thickness").value
);

const count=parseInt(
document.getElementById("diamondCount").value
);

const style=
document.getElementById("style").value;


/* SIZE */

const radius=
2.65+(size-2.5)*1.15;


/* MAIN GOLD BODY */

const body=new THREE.Mesh(

new THREE.TorusGeometry(
radius,
thickness,
64,
200
),

getMetalMaterial()

);

body.rotation.x=Math.PI/2;

jewelleryGroup.add(body);


/* POLISHED INNER RIM */

const inner=new THREE.Mesh(

new THREE.TorusGeometry(
radius-thickness*.55,
thickness*.13,
32,
180
),

getMetalMaterial()

);

inner.rotation.x=Math.PI/2;

jewelleryGroup.add(inner);


/* OUTER DECORATIVE RAIL */

if(style==="pave" || style==="solitaire"){

const rail=new THREE.Mesh(

new THREE.TorusGeometry(
radius+thickness*.55,
thickness*.10,
24,
180
),

getMetalMaterial()

);

rail.rotation.x=Math.PI/2;

jewelleryGroup.add(rail);

}


/* STONES */

const stoneType=
document.getElementById("stone").value;

if(stoneType==="none" || count===0)
return;


/* SOLITAIRE = LARGE CENTRAL STONES */

if(style==="solitaire"){

const positions=[
-Math.PI/2,
-Math.PI/6,
Math.PI/6,
Math.PI/2
];

positions.forEach(function(angle){

createProngSetting(
Math.cos(angle)*radius,
0,
Math.sin(angle)*radius,
angle,
thickness,
true
);

});

return;

}


/* CLASSIC / PAVE */

for(let i=0;i<count;i++){

const angle=
(i/count)*Math.PI*2;

createProngSetting(
Math.cos(angle)*radius,
0,
Math.sin(angle)*radius,
angle,
thickness,
false
);

}

}


/* =========================
   PRONG SETTING
========================= */

function createProngSetting(
x,y,z,
angle,
thickness,
large
){

const group=new THREE.Group();

const metal=getMetalMaterial();


/* BASE */

const baseRadius=
large ? .24 : .15;

const base=new THREE.Mesh(

new THREE.CylinderGeometry(
baseRadius*.85,
baseRadius,
.09,
32
),

metal

);

base.position.y=
thickness+.045;

group.add(base);


/* DIAMOND */

const selectedSize=
document.getElementById("diamondSize").value;

let r=.17;

if(selectedSize==="small")
r=.125;

if(selectedSize==="large")
r=.22;

if(large)
r*=1.7;

const diamond=makeDiamond(r);

diamond.position.y=
thickness+.22;

group.add(diamond);


/* FOUR PRONGS */

const prongHeight=
large ? .30 : .22;

const prongRadius=
large ? .035 : .024;

for(let i=0;i<4;i++){

const a=
i*Math.PI/2+
Math.PI/4;

const prong=new THREE.Mesh(

new THREE.CylinderGeometry(
prongRadius*.75,
prongRadius,
prongHeight,
12
),

metal

);

prong.position.set(

Math.cos(a)*r*.70,

thickness+.16,

Math.sin(a)*r*.70

);

group.add(prong);

}


/* SIDE SUPPORT */

const support1=new THREE.Mesh(

new THREE.CylinderGeometry(
.018,
.026,
.16,
10
),

metal

);

support1.rotation.z=.55;

support1.position.set(
-r*.45,
thickness+.10,
0
);

group.add(support1);


const support2=support1.clone();

support2.rotation.z=-.55;

support2.position.x=r*.45;

group.add(support2);


/* POSITION */

group.position.set(
x,y,z
);

group.rotation.y=-angle;

stoneGroup.add(group);

}


/* =========================
   RING
========================= */

function createRing(){

const thickness=parseFloat(
document.getElementById("thickness").value
);

const ring=new THREE.Mesh(

new THREE.TorusGeometry(
1.65,
thickness,
64,
180
),

getMetalMaterial()

);

ring.rotation.x=Math.PI/2;

jewelleryGroup.add(ring);


/* CENTER SETTING */

if(
document.getElementById("stone").value!=="none"
){

createProngSetting(
0,
0,
1.65,
0,
thickness,
true
);

}

}


/* =========================
   BRACELET
========================= */

function createBracelet(){

const thickness=parseFloat(
document.getElementById("thickness").value
);

const radius=2.7;

const bracelet=new THREE.Mesh(

new THREE.TorusGeometry(
radius,
thickness,
64,
200
),

getMetalMaterial()

);

bracelet.rotation.x=Math.PI/2;

jewelleryGroup.add(bracelet);

const count=parseInt(
document.getElementById("diamondCount").value
);

if(
document.getElementById("stone").value==="none"
)
return;

for(let i=0;i<count;i++){

const angle=
i/count*Math.PI*2;

createProngSetting(
Math.cos(angle)*radius,
0,
Math.sin(angle)*radius,
angle,
thickness,
false
);

}

}


/* =========================
   NECKLACE
========================= */

function createNecklace(){

const curve=new THREE.EllipseCurve(
0,0,
3.2,2.25,
0,Math.PI*2,
false,
0
);

const points=curve.getPoints(180);

const positions=[];

points.forEach(function(p){

positions.push(
new THREE.Vector3(
p.x,
0,
p.y
)
);

});

const geometry=
new THREE.BufferGeometry()
.setFromPoints(positions);

const material=
new THREE.LineBasicMaterial({
color:0xd4af37
});

const line=
new THREE.LineLoop(
geometry,
material
);

jewelleryGroup.add(line);


/* PENDANT */

if(
document.getElementById("stone").value!=="none"
){

const pendant=makeDiamond(.48);

pendant.position.set(
0,
0,
2.25
);

stoneGroup.add(pendant);

}

}


/* =========================
   EARRING
========================= */

function createEarring(){

const thickness=parseFloat(
document.getElementById("thickness").value
);

const hoop=new THREE.Mesh(

new THREE.TorusGeometry(
1.4,
thickness,
48,
160
),

getMetalMaterial()

);

hoop.rotation.x=Math.PI/2;

jewelleryGroup.add(hoop);

if(
document.getElementById("stone").value!=="none"
){

createProngSetting(
0,
0,
1.4,
0,
thickness,
true
);

}

}


/* =========================
   LIVE UPDATE
========================= */

function liveUpdate(){

document.getElementById(
"thicknessValue"
).innerText=
document.getElementById(
"thickness"
).value;

document.getElementById(
"diamondValue"
).innerText=
document.getElementById(
"diamondCount"
).value;

generateCAD();

}


/* =========================
   CONTROL EVENTS
========================= */

[
"type",
"metal",
"stone",
"style",
"size",
"thickness",
"diamondCount",
"diamondSize"
].forEach(function(id){

document.getElementById(id)
.addEventListener(
"input",
liveUpdate
);

document.getElementById(id)
.addEventListener(
"change",
liveUpdate
);

});


/* =========================
   GENERATE BUTTON
========================= */

document.getElementById("generate")
.addEventListener(
"click",
function(){

generateCAD();

document.getElementById("status").innerText=
"✨ CAD Generated ✓";

}
);


/* =========================
   STONES BUTTON
========================= */

document.getElementById("stones")
.addEventListener(
"click",
function(){

stonesVisible=!stonesVisible;

stoneGroup.visible=stonesVisible;

document.getElementById("status").innerText=
stonesVisible
?
"💎 Stones Visible"
:
"Stones Hidden";

}
);


/* =========================
   RESET
========================= */

document.getElementById("reset")
.addEventListener(
"click",
function(){

document.getElementById("type").value="bangle";
document.getElementById("metal").value="yellow";
document.getElementById("stone").value="diamond";
document.getElementById("style").value="classic";
document.getElementById("size").value="2.5";
document.getElementById("thickness").value=".28";
document.getElementById("diamondCount").value="24";
document.getElementById("diamondSize").value="medium";

document.getElementById(
"thicknessValue"
).innerText=".28";

document.getElementById(
"diamondValue"
).innerText="24";

stonesVisible=true;

stoneGroup.visible=true;

resetView();

generateCAD();

}
);


/* =========================
   FRONT VIEW
========================= */

document.getElementById("front")
.addEventListener(
"click",
function(){

camera.position.set(
0,
0,
9
);

controls.target.set(
0,0,0
);

controls.update();

}
);


/* =========================
   TOP VIEW
========================= */

document.getElementById("top")
.addEventListener(
"click",
function(){

camera.position.set(
0,
9,
0
);

controls.target.set(
0,0,0
);

controls.update();

}
);


/* =========================
   3D VIEW
========================= */

document.getElementById("view3d")
.addEventListener(
"click",
resetView
);

function resetView(){

camera.position.set(
0,
4.5,
8.5
);

controls.target.set(
0,
0,
0
);

controls.update();

}


/* =========================
   PHOTO
========================= */

document.getElementById("reference")
.addEventListener(
"change",
function(){

const file=this.files[0];

if(!file)
return;

const img=
document.getElementById("preview");

img.src=
URL.createObjectURL(file);

img.style.display="block";

}
);


/* =========================
   RESIZE
========================= */

function resize(){

const viewer=
document.getElementById("viewer");

camera.aspect=
viewer.clientWidth/
viewer.clientHeight;

camera.updateProjectionMatrix();

renderer.setSize(
viewer.clientWidth,
viewer.clientHeight
);

}


/* =========================
   ANIMATION
========================= */

function animate(){

requestAnimationFrame(animate);

controls.update();

renderer.render(
scene,
camera
);

}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
